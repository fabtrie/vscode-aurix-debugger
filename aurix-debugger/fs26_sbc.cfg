# Attach modes and reset policy for AURIX TC3xx boards supervised by an NXP FS26 safety SBC. Plugs into
# tc3xx_ocds.cfg (load that first and call tc3xx_setup), then: script fs26_sbc.cfg; sbc_setup
#
# What the board does (measured on a TC37x board). The policy assumes an application that behaves like
# this; check yours before relying on it:
#   - The FS26 watchdog is disarmed only by the application: at every start it re-initializes the FS26
#     (refresh, GOTO_INIT) and leaves the window infinite if a debugger is attached, i.e. if OCDS
#     (CBS_OSTATE.OEN) and DBGSR.DE are set when it checks, ~25 ms after it starts. Otherwise it arms
#     the window, and any halt then makes the FS26 reset the board (~80 ms).
#   - A power-on class reset (debugger reset, FS26 reset) clears OEN, the TL1 routing and every OCS;
#     the scripts restore them within ms after the device answers (tc3xx_reset_watch).
#   - So once the application has started with the debugger attached, it stays disarmed through every
#     reset the scripts see: they restore OCDS before its check. Only a board that started without
#     the debugger (power-up before the connection, or a reset while the connection was lost) is
#     armed. The scripts do not read the state from the application (its variables move with every
#     build): the first reset after the connection disarms it (see Resets), later ones do nothing
#     extra.
#   - Unwired board (debugger reset not on FS26 RSTB): the FS26 does not see the debugger's reset; once
#     disarmed, a halt at the reset vector holds.
#   - Wired board (debugger reset on RSTB): every debugger reset puts the FS26 into INIT_FS, which
#     resets the board if the core is still halted 256 ms later. A reset that runs on is fine (the
#     application closes INIT_FS in time). After 6 such resets the FS26 enters deep fail-safe,
#     power-cycles the board (auto retry, 100 ms) and restarts in debug mode: from then on halts hold,
#     also at the reset vector, until the application has run again.
#
# Attach modes (sbc_attach_mode, set before "init"; init_board then runs sbc_attach with it):
#   passive     no register written by these scripts: the targets are not examined, so aurix-dbg
#               does not enable OCDS or write SWEVT either; memory reads work (also with OCDS off),
#               halts and resets do not. The probe's own connection is not covered (the BlueBox
#               attach switches TL1 capture-and-hold on).
#   hot         attach to the running application without reset or halt; restores the TL1 routing
#               and suspends the peripherals the debugger may write. Reports whether halts are safe:
#               a halt needs the watchdog disarmed AND STM0/1 suspended (the application locks STM0/1
#               against the debugger at start-up, so only a reset gives them their suspend; with STM0/1
#               running through a halt the OS panics on resume and resets the board).
#               The watchdog state is not known after a hot attach. A halt then is watched for
#               sbc_armed_check_ms: if the FS26 resets the board (armed), the debugger re-attaches at
#               once, the application sees it and disarms the watchdog, and the cores are halted again;
#               if the halt holds, the watchdog is disarmed.
#   halt        hot, then (if halts are not safe) a reset so the application disarms the watchdog and
#               STM0/1 get their suspend, then halt all cores where the application is.
#   reset_halt  "reset halt": halted at the reset vector (see below)
#   reset_run   "reset run": the application runs, watchdog disarmed
#
# Resets (every reset request goes through sbc_reset_hook: Tcl, VS Code's reset, flashing). Every
# reset is followed by the same initialization (tc3xx_after_reset: OCDS, STM0/1/2+SMU suspend, TL1,
# HSM), whether the debugger, the FS26 or the application caused it.
#   run         reset halt, initialization, HSM release, resume (~40 ms halted, inside the wired
#               FS26's 256 ms: STM0/1 must be written before the application locks them); the first
#               one after the connection then lets the application run sbc_disarm_delay_ms without a
#               reset, so that it has disarmed the watchdog. Wired, every one waits sbc_init_fs_ms,
#               so that the application has closed INIT_FS before a halt can come.
#   halt|init   reset halt + initialization, then the halt is kept through every reset the FS26
#               makes: unwired it simply holds. Wired, the FS26 resets the chip at the end of its
#               INIT_FS window and counts a fault; cpu0 is halted again at once after each such
#               reset (before the application initializes the FS26, which would close INIT_FS and
#               clear the faults), until the FS26 goes through deep fail-safe and restarts in debug
#               mode; a last reset halt then holds at the reset vector.
#               Before the loop, a watchdog that is not known to be disarmed (first reset after the
#               connection) is disarmed by a running reset and sbc_disarm_delay_ms of running, unless
#               the board is known to be wired: an FS26 that does not see the debugger's reset would
#               end every halt after its window, and the loop would drive even an unwired board into
#               deep fail-safe.
#   Known disarmed: after that running reset, or a halt that held for sbc_armed_check_ms. Not known
#   again only when aurix-dbg found OCDS off after a reset the scripts did not see through (FS26
#   reset, power cycle, a reset while the connection was lost): the application may have checked
#   before OCDS was back. An application reset keeps OCDS and changes nothing, nor does a lost
#   connection without a reset.
#
# Settings (set before sbc_setup or before init):
#   sbc_attach_mode       passive|hot|halt|reset_halt|reset_run                        default hot
#   sbc_rstb_wired        debugger reset wired to the FS26 RSTB: 0 (no: the halt after a reset is not
#                         watched, nothing on the board ends it once the watchdog is disarmed; a reset
#                         that ends it anyway shows as a reset the poll detects), 1 (no disarming
#                         running reset before a halting one), auto
#                                                                                      default auto
#   sbc_wired_reset_halt  dfs|app: a halting reset that does not hold is repeated until deep
#                         fail-safe (dfs), or becomes a running reset and a halt in the
#                         application (app)                                            default dfs
#   sbc_disarm_delay_ms   the application has disarmed the watchdog once it ran this long without
#                         a reset                                                      default 500
#   sbc_disarm_timeout_ms give up when resets still come after this long               default 5000
#   sbc_armed_check_ms    a halt that holds this long (FS26 window ~80 ms) proves the watchdog
#                         disarmed                                                     default 300
#   sbc_init_fs_ms        wired: a running reset returns once the application ran this long
#                         without a reset, i.e. has closed the FS26's INIT_FS window (256 ms after
#                         the reset); a halt before that ends in an FS26 reset          default 300
#   sbc_hold_ms           a halt after a reset counts as held this long after the reset started
#                         (wired FS26: INIT_FS ends 256 ms after the reset)             default 400
#   sbc_dfs_max           FS26 resets accepted before giving up on deep fail-safe       default 20

tc3xx_default sbc_attach_mode       hot
tc3xx_default sbc_rstb_wired        auto
tc3xx_default sbc_wired_reset_halt  dfs
tc3xx_default sbc_disarm_delay_ms   500
tc3xx_default sbc_disarm_timeout_ms 5000
tc3xx_default sbc_armed_check_ms    300
tc3xx_default sbc_init_fs_ms        300
tc3xx_default sbc_hold_ms           400
tc3xx_default sbc_dfs_max           20
set sbc_busy 0
# What the scripts know about the FS26 while the application's variables say nothing yet (halted at
# the reset vector, RAM cleared): "" (read the variables), held (the halt at the vector holds: the
# FS26 did not see the reset or is in debug mode), debug (after deep fail-safe). Cleared when the
# cores resume.
set sbc_assume ""
# 1 once a halting reset was lost to the FS26 (debugger reset on RSTB); a held one proves nothing (a
# wired FS26 in debug mode does not reset either).
set sbc_wired_found 0
set sbc_recovery_failed 0
# 1 once the scripts know the application started with the debugger attached (see Resets above);
# sbc_disarmed_why: how it got known, or why not.
set sbc_disarmed 0
set sbc_disarmed_why "no reset since the connection"

proc sbc_setup {} {
	global tc3xx_policy
	if {![tc3xx_ocds_available]} {
		echo "Note: [adapter name] backend - FS26 attach modes and reset policy are not used."
		return
	}
	set tc3xx_policy sbc_policy
	if {[tc3xx_is_aurix_dbg]} {
		reset_hook sbc_reset_hook
	}
	proc init_targets {} { sbc_init_targets }
	proc init_board {} { sbc_init_board }
}

# --- Attach ------------------------------------------------------------------------------------------

# Before the connection: passive mode keeps aurix-dbg's examination (OCDS enable, SWEVT) away from all
# targets.
proc sbc_init_targets {} {
	global sbc_attach_mode tc3xx_chip
	# The chip's own pre-connect work first (e.g. the SCR target), so passive mode defers it too.
	tc3xx_init_targets
	if {$sbc_attach_mode eq "passive"} {
		foreach t [target names] {
			if {[string match "$tc3xx_chip.*" $t]} {
				$t configure -defer-examine
			}
		}
	}
}

proc sbc_init_board {} {
	if {[catch {sbc_attach $::sbc_attach_mode} err]} {
		echo "Warning: sbc_attach $::sbc_attach_mode: $err"
	}
	# The examination at the connection found OCDS as the board left it: the state starts unknown.
	sbc_ocds_lost
	set ::sbc_attached 1
}

proc sbc_attach {mode} {
	switch -- $mode {
		passive {
			echo "Passive attach: no register written by the scripts; memory reads only (no halt, no reset)."
			echo "FS26 watchdog: [sbc_state_text]"
		}
		hot {
			sbc_hot_attach
		}
		halt {
			sbc_hot_attach
			sbc_make_halt_safe
			if {[tc3xx_halt_all]} {
				echo "Halted in the application."
			}
		}
		reset_halt {
			reset halt
		}
		reset_run {
			reset run
		}
		default {
			return -code error "sbc_attach: passive|hot|halt|reset_halt|reset_run"
		}
	}
}

# The examination already restored OCDS and the TL1 routing (tc3xx_on_examine); the running
# application has enabled its modules, so the app-class suspend lands now (STM0/1 stay refused: the
# application locked them, they get their suspend with the next reset).
proc sbc_hot_attach {} {
	set left [suspend now]
	if {[llength $left]} {
		echo "Hot attach: no suspend for $left (locked or disabled by the application; set again after the next reset)"
	}
	if {[sbc_known_disarmed]} {
		echo "Hot attach: FS26 watchdog [sbc_state_text]"
	} else {
		echo "Hot attach: FS26 watchdog [sbc_state_text] - the first reset disarms it; a halt before that is watched, and if the FS26 resets the board the debugger re-attaches and halts again."
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		echo "Hot attach: $stm not suspended (locked by the application) - after a halt the OS panics on resume and resets the board. sbc_attach halt (or a reset) fixes it."
	}
	set ::sbc_attached 1
}

# Why a halt is not safe now ("" = safe): watchdog armed or unknown, or reset-class modules (STM0/1)
# without their suspend.
proc sbc_halt_unsafe {} {
	set why {}
	if {![sbc_known_disarmed]} {
		lappend why "FS26 watchdog [sbc_state_text]"
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		lappend why "$stm not suspended"
	}
	join $why "; "
}

# Safe already, or reset so that the application disarms the watchdog and STM0/1 get their suspend.
proc sbc_make_halt_safe {} {
	set why [sbc_halt_unsafe]
	if {$why ne ""} {
		echo "Halt not safe ($why): reset first"
		reset run
		# The halt comes in the application, after its start-up.
		sleep 100
	}
}

# --- Watchdog state ----------------------------------------------------------------------------------

# 1 when the application is known to have started with the debugger attached since the connection.
proc sbc_known_disarmed {} {
	expr {$::sbc_assume ne "" || $::sbc_disarmed}
}

proc sbc_set_disarmed {why} {
	set ::sbc_disarmed 1
	set ::sbc_disarmed_why $why
}

# 1 if aurix-dbg found OCDS off (and switched it on again) since the last call: a power-on class
# reset (FS26 reset, power cycle, also while the connection was lost) that the scripts did not answer
# within ms. The application may have checked for the debugger before OCDS was back. Also called to
# forget the resets the scripts saw through themselves.
proc sbc_ocds_lost {} {
	if {![llength [info commands ocds_found_off]]} {
		return 0
	}
	ocds_found_off
}

proc sbc_set_unknown {why} {
	set ::sbc_disarmed 0
	set ::sbc_disarmed_why $why
}

proc sbc_state_text {} {
	switch -- $::sbc_assume {
		debug { return "off (FS26 in debug mode after deep fail-safe, until the application runs)" }
		held  { return "not resetting (the halt at the reset vector holds; the application checks again when it runs)" }
	}
	if {$::sbc_disarmed} {
		return "disarmed ($::sbc_disarmed_why)"
	}
	return "not known to be disarmed ($::sbc_disarmed_why)"
}

# Lets the application run until no reset came for sbc_disarm_delay_ms: it has disarmed the watchdog
# by then. Restores OCDS and the reset-class suspend within ms after every reset on the way (FS26
# resets included), so that the application sees the debugger. Returns 1 when settled.
proc sbc_wait_disarmed {why} {
	global sbc_disarm_timeout_ms sbc_disarm_delay_ms
	set r [reset_settle $sbc_disarm_timeout_ms $sbc_disarm_delay_ms]
	if {![dict get $r settled]} {
		sbc_set_unknown "the board still resets after [dict get $r elapsed] ms"
		echo [format "Warning: the board still resets after %d ms (%d resets) - FS26 watchdog not known to be disarmed" \
			[dict get $r elapsed] [dict get $r resets]]
		return 0
	}
	sbc_set_disarmed $why
	echo [format "FS26 watchdog disarmed: the application ran %d ms with the debugger attached (%d resets on the way)" \
		[dict get $r elapsed] [dict get $r resets]]
	return 1
}

# --- Resets ------------------------------------------------------------------------------------------

# Every reset request (reset_hook). A "reset" issued in here is aurix-dbg's own sequence, which fires
# reset-end (tc3xx_on_reset_end: OCDS, TL1, suspend, HSM release) while the cores are halted.
proc sbc_reset_hook {mode} {
	global sbc_busy sbc_attach_mode
	if {$sbc_attach_mode eq "passive"} {
		return -code error "passive attach: resets are not allowed (they would write the target)"
	}
	set sbc_busy 1
	set rc [catch {
		switch -- $mode {
			run          { sbc_reset_run }
			halt - init  { sbc_reset_halt $mode }
		}
	} err]
	# The scripts saw these resets through (OCDS restored in time).
	sbc_ocds_lost
	set sbc_busy 0
	if {$rc} {
		return -code error $err
	}
}

# 1 when the debugger's reset is known to reach the FS26 RSTB (setting, or a lost halting reset).
proc sbc_wired {} {
	expr {$::sbc_rstb_wired eq "1" || ($::sbc_rstb_wired ne "0" && $::sbc_wired_found)}
}

# Before a halting reset, the first after the connection: a watchdog not known to be disarmed on a
# board whose FS26 may not see the debugger's reset would end the halt after its window (~80 ms). A
# reset that runs at once lets the application disarm it first: aurix-dbg enables OCDS right after it,
# in time for the application's check. STM0/1 miss their suspend there; the halting reset that follows
# gives it to them.
proc sbc_disarm_first {} {
	if {[sbc_wired] || [sbc_known_disarmed]} {
		return
	}
	echo "FS26 watchdog [sbc_state_text]: a running reset first, so that the application disarms it"
	if {[catch {reset run} err]} {
		echo "Warning: reset run: $err"
	}
	sbc_wait_disarmed "running reset after the connection"
}

# Reset without halt, as the user sees it: halted for ~40 ms after the reset so that STM0/1 get their
# suspend before the application locks them, then running. Not known disarmed (first reset after the
# connection): returns once the application ran sbc_disarm_delay_ms without a reset. An armed FS26 that
# ends the short halt, or resets the board after it, is seen through: OCDS is back in time for the
# application's check, and a halting reset it interrupted is done once more.
proc sbc_reset_run {} {
	for {set try 1} {$try <= 2} {incr try} {
		if {[catch {reset run} err]} {
			echo "Warning: reset interrupted ($err), watching the board through it"
		}
		if {![sbc_known_disarmed]} {
			sbc_wait_disarmed "running reset after the connection"
		} elseif {[sbc_wired]} {
			# The debugger's reset put the FS26 into INIT_FS: a halt before the application has
			# initialized the FS26 would end in its reset. Watched through, so that it has.
			reset_settle $::sbc_disarm_timeout_ms $::sbc_init_fs_ms
		}
		if {![llength [suspend pending locked]]} {
			return
		}
	}
	echo "Warning: [suspend pending locked] without suspend after the reset - a halt will reset the board on resume"
}

# Halting reset: reset halt + initialization (reset-end), then the halt is kept through every reset
# the FS26 makes. Unwired, the halt simply holds. Wired, the FS26 resets the chip when the core is
# still halted at the end of its INIT_FS window (256 ms) and counts a fault; the core is halted again
# at once after each such reset, before the application initializes the FS26 (which would close
# INIT_FS and work the fault counter down again), until the FS26 goes through deep fail-safe and
# restarts in debug mode (7-8 resets). A last reset halt then puts cpu0 at the reset vector, where
# it now holds.
proc sbc_reset_halt {mode} {
	global sbc_rstb_wired sbc_wired_reset_halt sbc_hold_ms sbc_dfs_max sbc_wired_found
	set cpu0 [tc3xx_cpu0]
	sbc_disarm_first
	set t0 [clock milliseconds]
	sbc_reset_retry $mode
	if {$sbc_rstb_wired eq "0"} {
		# The FS26 does not see the debugger's reset and its watchdog is disarmed: nothing ends the
		# halt, so it is not watched. A reset that ends it anyway is one the poll detects.
		set ::sbc_assume held
		return
	}
	# Repeat only where a deep fail-safe is wanted, not for "app".
	set rehalt [expr {$sbc_wired_reset_halt eq "dfs"}]
	set n [sbc_hold_through_resets $rehalt $sbc_dfs_max $sbc_hold_ms $t0]
	if {$n == 0} {
		set ::sbc_assume held
		return
	}
	set sbc_wired_found 1
	if {$sbc_wired_reset_halt eq "app"} {
		sbc_reset_run
		if {[tc3xx_halt_all]} {
			echo "Halt at the reset vector lost to the FS26: halted in the application instead (sbc_wired_reset_halt app)"
		}
		return
	}
	# The FS26 has stopped resetting: deep fail-safe, debug mode. Now to the reset vector.
	sbc_reset_retry $mode
	if {![tc3xx_halt_holds $cpu0 $sbc_hold_ms]} {
		return -code error "the halt at the reset vector is still lost after $n FS26 resets"
	}
	set ::sbc_assume debug
	echo [format "Halt at the reset vector holds after %d FS26 resets (%d ms): the FS26 went through deep fail-safe and is in debug mode until the application runs" \
		$n [expr {[clock milliseconds] - $t0}]]
}

# reset $mode (quick reset-end: the FS26's reset must come after it returns, for the watch to see
# it), retried while the board is off (deep fail-safe before its auto retry), up to 3 s.
proc sbc_reset_retry {mode} {
	for {set off 0} {[sbc_reset_quick $mode err]} {incr off} {
		if {$off >= 6} {
			return -code error "target unreachable for 3 s: the FS26 stays in deep fail-safe (no auto retry?) - power-cycle the board ($err)"
		}
		sleep 500
	}
}

proc sbc_reset_quick {mode errvar} {
	upvar $errvar err
	catch {reset $mode} err
}

# Watches cpu0 after a halting reset until its halt has held for hold_ms with no reset (STM0 reads
# fail and OSTATE.OEN is cleared when they work again, or STM0 counts from a lower value), counted
# from t0 (the start of the halting reset), after an FS26 reset from when it was seen. rehalt:
# after each reset, OCDS on and cpu0 halted again as soon as the device answers - within ~35 ms,
# before the application initializes the FS26 ~40 ms after it starts; otherwise return at the first
# reset. Returns the number of resets seen.
proc sbc_hold_through_resets {rehalt max_resets hold_ms {t0 ""}} {
	global tc3xx_dbgsr
	set dbgsr $tc3xx_dbgsr([tc3xx_cpu0])
	set n 0
	set prev ""
	set down_since -1
	set fails 0
	tc3xx_resets_mark
	set held_since [expr {$t0 eq "" ? [clock milliseconds] : $t0}]
	# Already running: the FS26 reset came during the halting reset itself (through a BlueBox its
	# reset and the handler can outlast the INIT_FS window).
	if {[catch {tc3xx_rd_retry $dbgsr} d] || ($d & 0x6) != 0x2} {
		incr n
		if {!$rehalt} {
			return $n
		}
		tc3xx_ocds_enable
		catch {mww $dbgsr 0x6}
	}
	while 1 {
		set now [clock milliseconds]
		set s [tc3xx_stm64]
		if {$s eq ""} {
			# Failed reads are a reset only if OEN turns out cleared when the device answers again:
			# through a miniWiggler while the HSM runs (released by the reset), ~3% of the reads
			# fail, now and then two in a row. Counting those made an unwired board look wired.
			if {[incr fails] < 2} {
				sleep 1
				continue
			}
			if {$down_since < 0} {
				set down_since $now
			} elseif {$now - $down_since > 3000} {
				return -code error "target unreachable for 3 s after $n FS26 resets: the FS26 stays in deep fail-safe (no auto retry?) - power-cycle the board"
			}
			sleep 1
			continue
		}
		set fails 0
		set reset [expr {$prev ne "" && $s < $prev}]
		if {$down_since >= 0} {
			if {[tc3xx_reset_cleared_oen]} {
				set reset 1
			}
			set down_since -1
		}
		if {$reset} {
			incr n
			if {!$rehalt} {
				return $n
			}
			if {$n > $max_resets} {
				return -code error "the FS26 still resets the board after $max_resets resets"
			}
			tc3xx_ocds_enable
			catch {mww $dbgsr 0x6}
			set held_since $now
			set s [tc3xx_stm64]
		}
		set prev $s
		if {$now - $held_since >= $hold_ms} {
			if {![catch {tc3xx_rd_retry $dbgsr} d] && ($d & 0x6) == 0x2} {
				return $n
			}
			# Not halted: a reset slipped through (or the halt request came too late). Counted, and
			# halted again; the FS26 resets again if it is still counting.
			incr n
			if {!$rehalt} {
				return $n
			}
			catch {mww $dbgsr 0x6}
			set held_since $now
		}
		sleep 2
	}
}

# --- Policy events (tc3xx_policy) --------------------------------------------------------------------

proc sbc_policy {event args} {
	switch -- $event {
		halted  { sbc_on_halted {*}$args }
		examine { sbc_on_examine }
		resumed { sbc_on_resumed }
	}
}

# A reset the poll detected (application or FS26 reset outside the scripts): the examination wrote
# STM0/1 if the application had not locked them yet. Say so when that race was lost.
# The watchdog is armed again only if the application started with OCDS off: aurix-dbg found it off
# (power-on class reset not answered in time, e.g. while the connection was lost); the next reset then
# disarms it again. An application reset keeps OCDS, and a lost connection without a reset changes
# nothing.
proc sbc_on_examine {} {
	global sbc_attached sbc_busy sbc_disarmed
	if {![info exists sbc_attached] || $sbc_busy} {
		return
	}
	if {[sbc_ocds_lost] && $sbc_disarmed} {
		sbc_set_unknown "OCDS was off after a reset the debugger did not see through"
		echo "Note: OCDS was off after a reset - the application may have started without the debugger; FS26 watchdog [sbc_state_text]. The next reset disarms it again."
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		echo "Warning: reset detected; $stm got no suspend before the application locked them - a halt now resets the board on resume (sbc_attach halt fixes it)"
	}
}

# A halt while the watchdog is not known to be disarmed (hot attach, then pause or a breakpoint): an
# armed FS26 resets the board within its window (~80 ms). Watched for sbc_armed_check_ms: a halt that
# holds proves it disarmed. A reset instead is seen through rather than losing the session: OCDS is
# restored at once so that the application sees the debugger and disarms the watchdog, then the cores
# are halted again in the application.
proc sbc_on_halted {self} {
	global sbc_busy sbc_recovery_failed sbc_armed_check_ms
	# Once per halt: TL1 halts all cores together and each reports its halt; a recovery that did
	# not disarm the watchdog is not tried again before the next resume.
	if {$sbc_busy || $self ne [tc3xx_cpu0] || $sbc_recovery_failed} {
		return
	}
	if {![sbc_known_disarmed]} {
		set sbc_busy 1
		set r [reset_settle $sbc_armed_check_ms $sbc_armed_check_ms]
		if {[dict get $r settled] && [dict get $r resets] == 0} {
			set sbc_busy 0
			if {[[tc3xx_cpu0] curstate] eq "halted"} {
				sbc_set_disarmed "a halt held for $sbc_armed_check_ms ms"
			}
		} else {
			echo "Warning: the FS26 reset the board after the halt (watchdog armed) - re-attached; the application disarms it now, then the cores are halted again."
			if {[sbc_wait_disarmed "the application restarted with the debugger attached"]} {
				tc3xx_halt_all
			} else {
				set sbc_recovery_failed 1
			}
			sbc_ocds_lost
			set sbc_busy 0
			return
		}
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		echo "Warning: halted with $stm not suspended - the OS will panic on resume and reset the board (reset, or sbc_attach halt, first)"
	}
}

# Resumed after a halting reset the scripts did (held at the vector, OCDS on): the application starts
# with the debugger attached and disarms the watchdog.
proc sbc_on_resumed {} {
	global sbc_assume
	if {$sbc_assume ne "" && !$::sbc_disarmed} {
		sbc_set_disarmed "the application started from the halting reset with the debugger attached"
	}
	set sbc_assume ""
	set ::sbc_recovery_failed 0
}

# monitor sbc_status
proc sbc_status {} {
	global sbc_attach_mode sbc_rstb_wired sbc_wired_reset_halt
	echo [format "attach mode %s; debugger reset on FS26 RSTB: %s (setting %s); halt not held: %s" \
		$sbc_attach_mode [expr {[sbc_wired] ? "yes" : "not seen"}] $sbc_rstb_wired $sbc_wired_reset_halt]
	echo "FS26 watchdog: [sbc_state_text]"
}
