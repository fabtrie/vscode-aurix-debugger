# Attach modes and reset policy for AURIX TC3xx boards supervised by an NXP FS26 safety SBC. Plugs into
# tc3xx_ocds.cfg (load that first and call tc3xx_setup), then: script fs26_sbc.cfg; sbc_setup
#
# What the board does (measured on a TC37x board). The policy assumes an application that behaves like
# this; check yours before relying on it:
#   - The FS26 watchdog is disarmed only by the application: at every start it re-initializes the FS26
#     (refresh, GOTO_INIT) and leaves the window infinite if a debugger is attached, i.e. if OCDS
#     (CBS_OSTATE.OEN) and DBGSR.DE are set when it checks, ~25 ms after it starts. Otherwise it arms
#     the window, and any halt then makes the FS26 reset the board (~80 ms).
#   - A power-on class reset (debugger reset, FS26 reset) clears OEN, the TL1 routing and every OCS;
#     the scripts restore them within ms after the device answers (tc3xx_reset_watch).
#   - Unwired board (debugger reset not on FS26 RSTB): the FS26 does not see the debugger's reset; once
#     disarmed, a halt at the reset vector holds.
#   - Wired board (debugger reset on RSTB): every debugger reset puts the FS26 into INIT_FS, which
#     resets the board if the core is still halted 256 ms later. A reset that runs on is fine (the
#     application closes INIT_FS in time). After 6 such resets the FS26 enters deep fail-safe,
#     power-cycles the board (auto retry, 100 ms) and restarts in debug mode: from then on halts hold,
#     also at the reset vector, until the application has run again.
#
# Attach modes (sbc_attach_mode, set before "init"; init_board then runs sbc_attach with it):
#   passive     no register written by these scripts: the targets are not examined, so aurix-dbg
#               does not enable OCDS or write SWEVT either; memory reads work (also with OCDS off),
#               halts and resets do not. The probe's own connection is not covered (the BlueBox
#               attach switches TL1 capture-and-hold on).
#   hot         attach to the running application without reset or halt; restores the TL1 routing
#               and suspends the peripherals the debugger may write. Reports whether halts are safe:
#               a halt needs the watchdog disarmed AND STM0/1 suspended (the application locks STM0/1
#               against the debugger at start-up, so only a reset gives them their suspend; with STM0/1
#               running through a halt the OS panics on resume and resets the board).
#               A halt while armed: the FS26 resets the board; the debugger re-attaches at once, the
#               application then sees it and disarms the watchdog, and the cores are halted again.
#   halt        hot, then (if halts are not safe) a reset so the application disarms the watchdog and
#               STM0/1 get their suspend, then halt all cores where the application is.
#   reset_halt  "reset halt": halted at the reset vector (see below)
#   reset_run   "reset run": the application runs, watchdog disarmed
#
# Resets (every reset request goes through sbc_reset_hook: Tcl, VS Code's reset, flashing). Every
# reset is followed by the same initialization (tc3xx_after_reset: OCDS, STM0/1/2+SMU suspend, TL1,
# HSM), whether the debugger, the FS26 or the application caused it.
#   run         reset halt, initialization, HSM release, resume (~150 ms halted, inside the wired
#               FS26's 256 ms: STM0/1 must be written before the application locks them), then wait
#               until the application has disarmed the watchdog.
#   halt|init   reset halt + initialization, repeated until the halt holds. Unwired, the first one
#               holds. Wired, each one is ended by the FS26's INIT_FS reset and counts as a fault,
#               until the FS26 goes through deep fail-safe (board power-cycled once) and restarts in
#               debug mode: then it holds (measured: 7 resets, 3.6 s).
#               Before the loop, a watchdog that is not known to be disarmed is disarmed by a running
#               reset, unless the board is known to be wired: an FS26 that does not see the debugger's
#               reset would end every halt after its window, and the loop would drive even an unwired
#               board into deep fail-safe.
#
# Settings (set before sbc_setup or before init):
#   sbc_attach_mode       passive|hot|halt|reset_halt|reset_run                        default hot
#   sbc_rstb_wired        debugger reset wired to the FS26 RSTB: 0 (a lost halt is reported, never
#                         repeated), 1 (no disarming running reset before a halting one), auto
#                                                                                      default auto
#   sbc_wired_reset_halt  dfs|app: a halting reset that does not hold is repeated until deep
#                         fail-safe (dfs), or becomes a running reset and a halt in the
#                         application (app)                                            default dfs
#   sbc_disarm_check      {{addr mask op value} ...} all true = disarmed (op: == != >=), from the ELF
#                         of the running application; empty: unknown, sbc_disarm_delay_ms is used
#   sbc_disarm_delay_ms   without a check: the application has disarmed this long after a reset
#                                                                                      default 1500
#   sbc_disarm_timeout_ms give up waiting for the disarm after this long               default 5000
#   sbc_quiet_ms          resets have settled when none came for this long             default 300
#   sbc_hold_ms           a halt counts as held after this long                        default 400
#   sbc_dfs_max           halting resets tried before giving up                         default 20

tc3xx_default sbc_attach_mode       hot
tc3xx_default sbc_rstb_wired        auto
tc3xx_default sbc_wired_reset_halt  dfs
tc3xx_default sbc_disarm_check      {}
tc3xx_default sbc_disarm_delay_ms   1500
tc3xx_default sbc_disarm_timeout_ms 5000
tc3xx_default sbc_quiet_ms          300
tc3xx_default sbc_hold_ms           400
tc3xx_default sbc_dfs_max           20
set sbc_busy 0
# What the scripts know about the FS26 while the application's variables say nothing yet (halted at
# the reset vector, RAM cleared): "" (read the variables), held (the halt at the vector holds: the
# FS26 did not see the reset or is in debug mode), debug (after deep fail-safe). Cleared when the
# cores resume.
set sbc_assume ""
# 1 once a halting reset was lost to the FS26 (debugger reset on RSTB); a held one proves nothing (a
# wired FS26 in debug mode does not reset either).
set sbc_wired_found 0
set sbc_recovery_failed 0

proc sbc_setup {} {
	global tc3xx_policy
	if {![tc3xx_ocds_available]} {
		echo "Note: [adapter name] backend - FS26 attach modes and reset policy are not used."
		return
	}
	set tc3xx_policy sbc_policy
	if {[tc3xx_is_aurix_dbg]} {
		reset_hook sbc_reset_hook
	}
	proc init_targets {} { sbc_init_targets }
	proc init_board {} { sbc_init_board }
}

# --- Attach ------------------------------------------------------------------------------------------

# Before the connection: passive mode keeps aurix-dbg's examination (OCDS enable, SWEVT) away from all
# targets.
proc sbc_init_targets {} {
	global sbc_attach_mode tc3xx_chip
	if {$sbc_attach_mode eq "passive"} {
		foreach t [target names] {
			if {[string match "$tc3xx_chip.*" $t]} {
				$t configure -defer-examine
			}
		}
	}
}

proc sbc_init_board {} {
	if {[catch {sbc_attach $::sbc_attach_mode} err]} {
		echo "Warning: sbc_attach $::sbc_attach_mode: $err"
	}
	set ::sbc_attached 1
}

proc sbc_attach {mode} {
	switch -- $mode {
		passive {
			echo "Passive attach: no register written by the scripts; memory reads only (no halt, no reset)."
			echo "FS26 watchdog: [sbc_state_text]"
		}
		hot {
			sbc_hot_attach
		}
		halt {
			sbc_hot_attach
			sbc_make_halt_safe
			if {[tc3xx_halt_all]} {
				echo "Halted in the application."
			}
		}
		reset_halt {
			reset halt
		}
		reset_run {
			reset run
		}
		default {
			return -code error "sbc_attach: passive|hot|halt|reset_halt|reset_run"
		}
	}
}

# The examination already restored OCDS and the TL1 routing (tc3xx_on_examine); the running
# application has enabled its modules, so the app-class suspend lands now (STM0/1 stay refused: the
# application locked them, they get their suspend with the next reset).
proc sbc_hot_attach {} {
	set left [tc3xx_periph_suspend all]
	if {[llength $left]} {
		echo "Hot attach: no suspend for $left (locked or disabled by the application; set again after the next reset)"
	}
	set st [sbc_is_disarmed]
	if {$st eq "0"} {
		echo "Hot attach: FS26 watchdog ARMED - a halt makes the FS26 reset the board; the debugger then re-attaches, the application disarms the watchdog and the cores are halted again. sbc_attach halt does this now."
	} else {
		echo "Hot attach: FS26 watchdog [sbc_state_text]"
	}
	set stm [tc3xx_periph_pending reset]
	if {[llength $stm]} {
		echo "Hot attach: $stm not suspended (locked by the application) - after a halt the OS panics on resume and resets the board. sbc_attach halt (or a reset) fixes it."
	}
	set ::sbc_attached 1
}

# Why a halt is not safe now ("" = safe): watchdog armed or unknown, or reset-class modules (STM0/1)
# without their suspend.
proc sbc_halt_unsafe {} {
	set why {}
	if {[sbc_is_disarmed] ne "1"} {
		lappend why "FS26 watchdog [sbc_state_text]"
	}
	set stm [tc3xx_periph_pending reset]
	if {[llength $stm]} {
		lappend why "$stm not suspended"
	}
	join $why "; "
}

# Safe already, or reset so that the application disarms the watchdog and STM0/1 get their suspend.
proc sbc_make_halt_safe {} {
	set why [sbc_halt_unsafe]
	if {$why ne ""} {
		echo "Halt not safe ($why): reset first"
		reset run
	}
}

# --- Watchdog state ----------------------------------------------------------------------------------

# 1 disarmed, 0 armed, unknown (no check configured or not readable). Read live from the application's
# variables: what it found at its last start.
proc sbc_is_disarmed {} {
	global sbc_disarm_check sbc_assume
	if {$sbc_assume ne ""} {
		return 1
	}
	if {![llength $sbc_disarm_check]} {
		return unknown
	}
	foreach c $sbc_disarm_check {
		lassign $c addr mask op value
		if {[catch {tc3xx_rd $addr} v]} {
			return unknown
		}
		set v [expr {$v & $mask}]
		switch -- $op {
			== { set ok [expr {$v == $value}] }
			!= { set ok [expr {$v != $value}] }
			>= { set ok [expr {$v >= $value}] }
			default { return -code error "sbc_disarm_check: op must be == != >=" }
		}
		if {!$ok} {
			return 0
		}
	}
	return 1
}

proc sbc_state_text {} {
	switch -- $::sbc_assume {
		debug { return "off (FS26 in debug mode after deep fail-safe, until the application runs)" }
		held  { return "not resetting (the halt at the reset vector holds; the application checks again when it runs)" }
	}
	switch -- [sbc_is_disarmed] {
		1 { return "disarmed (application saw the debugger)" }
		0 { return "armed (application started without the debugger)" }
		default { return "state unknown (no sbc_disarm_check)" }
	}
}

# Condition for tc3xx_reset_watch: disarmed, or without a check the fixed delay since the reset.
proc sbc_disarmed_cond {} {
	global sbc_disarm_check sbc_wait_t0 sbc_disarm_delay_ms
	if {[llength $sbc_disarm_check]} {
		return [expr {[sbc_is_disarmed] eq "1"}]
	}
	expr {[clock milliseconds] - $sbc_wait_t0 >= $sbc_disarm_delay_ms}
}

# Lets the application run until it has disarmed the watchdog, restoring OCDS and the reset-class
# suspend within ms after every reset on the way (FS26 resets included). Returns 1 when disarmed.
proc sbc_wait_disarmed {} {
	global sbc_disarm_timeout_ms sbc_quiet_ms sbc_wait_t0
	set sbc_wait_t0 [clock milliseconds]
	set r [tc3xx_reset_watch $sbc_disarm_timeout_ms $sbc_quiet_ms sbc_disarmed_cond]
	if {![dict get $r settled]} {
		echo [format "Warning: FS26 watchdog not disarmed after %d ms (%d resets): %s" \
			[dict get $r elapsed] [dict get $r resets] [sbc_state_text]]
		return 0
	}
	echo [format "FS26 watchdog %s after %d ms (%d resets on the way)" \
		[sbc_state_text] [dict get $r elapsed] [dict get $r resets]]
	return 1
}

# --- Resets ------------------------------------------------------------------------------------------

# Every reset request (reset_hook). A "reset" issued in here is aurix-dbg's own sequence, which fires
# reset-end (tc3xx_on_reset_end: OCDS, TL1, suspend, HSM release) while the cores are halted.
proc sbc_reset_hook {mode} {
	global sbc_busy sbc_attach_mode
	if {$sbc_attach_mode eq "passive"} {
		return -code error "passive attach: resets are not allowed (they would write the target)"
	}
	set sbc_busy 1
	set rc [catch {
		switch -- $mode {
			run          { sbc_reset_run }
			halt - init  { sbc_reset_halt $mode }
		}
	} err]
	set sbc_busy 0
	if {$rc} {
		return -code error $err
	}
}

# 1 when the debugger's reset is known to reach the FS26 RSTB (setting, or a lost halting reset).
proc sbc_wired {} {
	expr {$::sbc_rstb_wired eq "1" || ($::sbc_rstb_wired ne "0" && $::sbc_wired_found)}
}

# Before a reset that halts (also the ~150 ms init halt of a running reset): a watchdog not known to
# be disarmed (armed, or no disarm check) on a board whose FS26 may not see the debugger's reset would
# end the halt after its window (~80 ms). A reset that runs at once lets the application disarm it
# first: aurix-dbg enables OCDS right after it, in time for the application's check. STM0/1 miss their
# suspend there; the halting reset that follows gives it to them.
proc sbc_disarm_first {} {
	if {[sbc_wired] || [sbc_is_disarmed] eq "1"} {
		return
	}
	echo "FS26 watchdog [sbc_state_text]: a running reset first, so that the application disarms it"
	if {[catch {reset run} err]} {
		echo "Warning: reset run: $err"
	}
	sbc_wait_disarmed
}

# Reset without halt, as the user sees it: halted for ~150 ms after the reset so that STM0/1 get their
# suspend before the application locks them, then running; returns once the watchdog is disarmed. A
# halting reset that an FS26 reset interrupts is seen through and done once more.
proc sbc_reset_run {} {
	sbc_disarm_first
	for {set try 1} {$try <= 2} {incr try} {
		if {[catch {reset halt} err]} {
			echo "Warning: halting reset interrupted ($err), watching the board through it"
			sbc_wait_disarmed
			continue
		}
		tc3xx_resume_all
		sbc_wait_disarmed
		if {![llength [tc3xx_periph_pending reset]]} {
			return
		}
	}
	echo "Warning: [tc3xx_periph_pending reset] without suspend after the reset - a halt will reset the board on resume"
}

# Halting reset: reset halt + initialization (reset-end), repeated until the halt holds for
# sbc_hold_ms. Unwired it holds at once. Wired, the FS26 ends each halt with its INIT_FS reset (a
# fault) until it goes through deep fail-safe and restarts in debug mode; then it holds.
proc sbc_reset_halt {mode} {
	global sbc_rstb_wired sbc_wired_reset_halt sbc_hold_ms sbc_dfs_max sbc_wired_found
	set cpu0 [tc3xx_cpu0]
	sbc_disarm_first
	set t0 [clock milliseconds]
	set off 0
	for {set n 1} {$n <= $sbc_dfs_max} {incr n} {
		if {[catch {reset $mode} err]} {
			# Board off: deep fail-safe, before (or without) its auto retry.
			if {[incr off] >= 6} {
				return -code error "target unreachable for 3 s: the FS26 stays in deep fail-safe (no auto retry?) - power-cycle the board"
			}
			sleep 500
			continue
		}
		set off 0
		if {[tc3xx_halt_holds $cpu0 $sbc_hold_ms]} {
			if {$n == 1} {
				set ::sbc_assume held
			} else {
				set ::sbc_assume debug
				echo [format "Halt at the reset vector holds after %d halting resets (%d ms): the FS26 went through deep fail-safe and is in debug mode until the application runs" \
					$n [expr {[clock milliseconds] - $t0}]]
			}
			return
		}
		set sbc_wired_found 1
		if {$sbc_rstb_wired eq "0"} {
			return -code error "halt at the reset vector lost (an FS26 reset?) although sbc_rstb_wired is 0 - not repeated"
		}
		if {$sbc_wired_reset_halt eq "app"} {
			sbc_reset_run
			if {[tc3xx_halt_all]} {
				echo "Halt at the reset vector lost to the FS26: halted in the application instead (sbc_wired_reset_halt app)"
			}
			return
		}
		if {$n == 1} {
			echo "Halt at the reset vector lost to the FS26 (debugger reset on its RSTB): repeating until it goes through deep fail-safe"
		}
	}
	return -code error "the FS26 still resets the board after $sbc_dfs_max halting resets"
}

# --- Policy events (tc3xx_policy) --------------------------------------------------------------------

proc sbc_policy {event args} {
	switch -- $event {
		halted  { sbc_on_halted {*}$args }
		examine { sbc_on_examine }
		resumed { set ::sbc_assume ""; set ::sbc_recovery_failed 0 }
	}
}

# A reset the poll detected (application or FS26 reset outside the scripts): the examination wrote
# STM0/1 if the application had not locked them yet. Say so when that race was lost.
proc sbc_on_examine {} {
	global sbc_attached sbc_busy
	if {![info exists sbc_attached] || $sbc_busy} {
		return
	}
	set stm [tc3xx_periph_pending reset]
	if {[llength $stm]} {
		echo "Warning: reset detected; $stm got no suspend before the application locked them - a halt now resets the board on resume (sbc_attach halt fixes it)"
	}
}

# A halt while the watchdog is armed (hot attach, then pause or a breakpoint): the FS26 resets the
# board within its window. Instead of losing the session, see the reset through: restore OCDS at once
# so that the application sees the debugger and disarms the watchdog, then halt again in the
# application.
proc sbc_on_halted {self} {
	global sbc_busy sbc_recovery_failed
	# Once per halt: TL1 halts all cores together and each reports its halt; a recovery that did
	# not disarm the watchdog is not tried again before the next resume.
	if {$sbc_busy || $self ne [tc3xx_cpu0] || $sbc_recovery_failed} {
		return
	}
	if {[sbc_is_disarmed] ne "0"} {
		set stm [tc3xx_periph_pending reset]
		if {[llength $stm]} {
			echo "Warning: halted with $stm not suspended - the OS will panic on resume and reset the board (reset, or sbc_attach halt, first)"
		}
		return
	}
	set sbc_busy 1
	echo "Warning: halted while the FS26 watchdog is armed - it resets the board now; re-attaching so that the application disarms it, then halting again."
	set ok [sbc_wait_disarmed]
	if {$ok} {
		tc3xx_halt_all
	} else {
		set sbc_recovery_failed 1
	}
	set sbc_busy 0
}

# monitor sbc_status
proc sbc_status {} {
	global sbc_attach_mode sbc_rstb_wired sbc_wired_reset_halt
	echo [format "attach mode %s; debugger reset on FS26 RSTB: %s (setting %s); halt not held: %s" \
		$sbc_attach_mode [expr {[sbc_wired] ? "yes" : "not seen"}] $sbc_rstb_wired $sbc_wired_reset_halt]
	echo "FS26 watchdog: [sbc_state_text]"
}
