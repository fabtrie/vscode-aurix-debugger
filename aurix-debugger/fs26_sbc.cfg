# NXP FS26 safety-SBC reset and halt policy for TC3xx boards. Loaded by tc3xx_ocds.cfg when the board
# cfg sets "set tc3xx_sbc fs26"; do not use it on a board without an FS26. Installs reset_hook and
# halt_check_hook and handles cpu0's examine-end, halted and resume-end events. Not used on the
# winidea backend.
#
# Application it expects (check yours): at every start it initializes the FS26 and leaves the watchdog
# disarmed (infinite window) if OCDS (OSTATE.OEN) and DBGSR.DE are set at its check, ~25 ms after the
# start; otherwise it arms it, and a halt makes the FS26 reset the board within ~80 ms. The server
# switches OCDS on again after every reset in time for that check, so once the application has started
# with the debugger attached, the watchdog stays disarmed.
#
# Board wiring (sbc_rstb_wired):
#   unwired  debugger reset not on the FS26 RSTB: once disarmed, a halt at the reset vector holds.
#   wired    debugger reset on RSTB: every debugger reset starts the FS26 INIT_FS window, and a core
#            still halted 256 ms later makes the FS26 reset the board. After 6 such resets the FS26
#            goes through deep fail-safe (power cycle, auto retry) and restarts in debug mode: halts
#            then hold, also at the reset vector, until the application runs again.
#
# Behaviour:
#   attach           watchdog state unknown. A halt is watched for sbc_armed_check_ms: if it holds,
#                    the watchdog is disarmed; if the FS26 resets the board, the application restarts
#                    with the debugger attached and the cores are halted again. "attach_mode halt"
#                    resets first while the state is unknown.
#   reset run        the first one after the connection returns once the application ran
#                    sbc_disarm_delay_ms without a reset. Wired: every one waits sbc_init_fs_ms, so
#                    that a halt right after it does not end in an FS26 reset.
#   reset halt|init  the first one after the connection, on a board not known to be wired, does a
#                    disarming running reset before. Wired: after each FS26 reset cpu0 is halted again
#                    until deep fail-safe, then reset halt holds at the reset vector
#                    (sbc_wired_reset_halt dfs), or it halts in the application instead (app).
#   The state becomes unknown again only when the server finds OCDS off after a reset it did not see
#   through (FS26 reset, power cycle, reset while disconnected); the next reset disarms again.
#
# Settings (set before tc3xx_ocds.cfg, or before init):
#   sbc_rstb_wired         debugger reset on the FS26 RSTB: auto (wired once a halting reset is lost),
#                          1 (skips the disarming running reset), 0 (skips the sbc_hold_ms watch of
#                          each halting reset)                                       default auto
#   sbc_wired_reset_halt   dfs|app: a halting reset that does not hold is repeated until deep
#                          fail-safe (dfs), or becomes a running reset and a halt in the
#                          application (app)                                          default dfs
#   sbc_disarm_delay_ms    run time without a reset after which the watchdog counts as disarmed
#                                                                                     default 500
#   sbc_disarm_timeout_ms  give up when resets still come after this long            default 5000
#   sbc_armed_check_ms     a halt that holds this long proves the watchdog disarmed (FS26 window
#                          ~80 ms)                                                    default 300
#   sbc_init_fs_ms         wired: run time without a reset before a running reset returns (INIT_FS
#                          ends 256 ms after the reset)                               default 300
#   sbc_hold_ms            a halt after a reset counts as held this long after the reset started
#                          (longer than the 256 ms INIT_FS window)                    default 400
#   sbc_dfs_max            FS26 resets accepted before giving up on deep fail-safe    default 20
#
# monitor sbc_status: attach mode, wiring, watchdog state.

tc3xx_default sbc_rstb_wired        auto
tc3xx_default sbc_wired_reset_halt  dfs
tc3xx_default sbc_disarm_delay_ms   500
tc3xx_default sbc_disarm_timeout_ms 5000
tc3xx_default sbc_armed_check_ms    300
tc3xx_default sbc_init_fs_ms        300
tc3xx_default sbc_hold_ms           400
tc3xx_default sbc_dfs_max           20
set sbc_busy 0
# State during a halt at the reset vector after a policy reset: "" (none), held (the halt holds),
# debug (FS26 in debug mode after deep fail-safe). Cleared on resume.
set sbc_assume ""
# 1 once a halting reset was lost to the FS26: the debugger reset is on RSTB.
set sbc_wired_found 0
set sbc_recovery_failed 0
# 1 once the application is known to have started with the debugger attached (watchdog disarmed);
# sbc_disarmed_why: how it got known, or why not.
set sbc_disarmed 0
set sbc_disarmed_why "no reset since the connection"

# Called by tc3xx_ocds.cfg: installs the hooks and cpu0's event handlers.
proc fs26_setup {} {
	if {![tc3xx_ocds_available]} {
		echo "Note: [adapter name] backend - the FS26 reset policy is not used."
		return
	}
	reset_hook sbc_reset_hook
	halt_check_hook sbc_halt_check
	proc init_board {} { sbc_init_board }
	set cpu0 [tc3xx_cpu0]
	$cpu0 configure -event examine-end sbc_on_examine
	$cpu0 configure -event halted      sbc_on_halted
	$cpu0 configure -event resume-end  sbc_on_resumed
}

# --- Attach ------------------------------------------------------------------------------------------

# init_board, before the attach mode: the watchdog state starts unknown; reports it.
proc sbc_init_board {} {
	sbc_ocds_lost
	set ::sbc_attached 1
	if {[sbc_known_disarmed]} {
		echo "FS26 watchdog: [sbc_state_text]"
	} else {
		echo "FS26 watchdog: [sbc_state_text] - the first reset disarms it; a halt before that is watched, and if the FS26 resets the board the debugger re-attaches and halts again."
	}
}

# halt_check_hook: why a halt is not safe now ("" = safe).
proc sbc_halt_check {} {
	if {![sbc_known_disarmed]} {
		return "FS26 watchdog [sbc_state_text]"
	}
	return ""
}

# --- Watchdog state ----------------------------------------------------------------------------------

# 1 when the watchdog is known to be disarmed.
proc sbc_known_disarmed {} {
	expr {$::sbc_assume ne "" || $::sbc_disarmed}
}

proc sbc_set_disarmed {why} {
	set ::sbc_disarmed 1
	set ::sbc_disarmed_why $why
}

# 1 if the server found OCDS off since the last call (a power-on class reset not answered in time:
# the application may have missed the debugger); clears it. Also called to drop resets the policy
# handled itself.
proc sbc_ocds_lost {} {
	if {![llength [info commands ocds_found_off]]} {
		return 0
	}
	ocds_found_off
}

proc sbc_set_unknown {why} {
	set ::sbc_disarmed 0
	set ::sbc_disarmed_why $why
}

proc sbc_state_text {} {
	switch -- $::sbc_assume {
		debug { return "off (FS26 in debug mode after deep fail-safe, until the application runs)" }
		held  { return "not resetting (the halt at the reset vector holds; the application checks again when it runs)" }
	}
	if {$::sbc_disarmed} {
		return "disarmed ($::sbc_disarmed_why)"
	}
	return "not known to be disarmed ($::sbc_disarmed_why)"
}

# Lets the application run until no reset came for sbc_disarm_delay_ms (watchdog disarmed), at most
# sbc_disarm_timeout_ms. Returns 1 when settled.
proc sbc_wait_disarmed {why} {
	global sbc_disarm_timeout_ms sbc_disarm_delay_ms
	set r [reset_settle $sbc_disarm_timeout_ms $sbc_disarm_delay_ms]
	if {![dict get $r settled]} {
		sbc_set_unknown "the board still resets after [dict get $r elapsed] ms"
		echo [format "Warning: the board still resets after %d ms (%d resets) - FS26 watchdog not known to be disarmed" \
			[dict get $r elapsed] [dict get $r resets]]
		return 0
	}
	sbc_set_disarmed $why
	echo [format "FS26 watchdog disarmed: the application ran %d ms with the debugger attached (%d resets on the way)" \
		[dict get $r elapsed] [dict get $r resets]]
	return 1
}

# --- Resets ------------------------------------------------------------------------------------------

# reset_hook: every reset request. A "reset" in here runs the server's own sequence.
proc sbc_reset_hook {mode} {
	global sbc_busy
	set sbc_busy 1
	set rc [catch {
		switch -- $mode {
			run          { sbc_reset_run }
			halt - init  { sbc_reset_halt $mode }
		}
	} err]
	# Resets handled here do not count as OCDS found off.
	sbc_ocds_lost
	set sbc_busy 0
	if {$rc} {
		return -code error $err
	}
}

# 1 when the debugger's reset is known to reach the FS26 RSTB (setting, or a lost halting reset).
proc sbc_wired {} {
	expr {$::sbc_rstb_wired eq "1" || ($::sbc_rstb_wired ne "0" && $::sbc_wired_found)}
}

# Before a halting reset while the watchdog is not known to be disarmed and the board not known to be
# wired: a running reset lets the application disarm it, else the FS26 ends the halt within ~80 ms.
proc sbc_disarm_first {} {
	if {[sbc_wired] || [sbc_known_disarmed]} {
		return
	}
	echo "FS26 watchdog [sbc_state_text]: a running reset first, so that the application disarms it"
	if {[catch {reset run} err]} {
		echo "Warning: reset run: $err"
	}
	sbc_wait_disarmed "running reset after the connection"
}

# reset run. Not known disarmed: returns once the application ran sbc_disarm_delay_ms without a reset.
# Wired: waits sbc_init_fs_ms. Done once more if the application locked modules before their suspend.
proc sbc_reset_run {} {
	for {set try 1} {$try <= 2} {incr try} {
		if {[catch {reset run} err]} {
			echo "Warning: reset interrupted ($err), watching the board through it"
		}
		if {![sbc_known_disarmed]} {
			sbc_wait_disarmed "running reset after the connection"
		} elseif {[sbc_wired]} {
			# The debugger reset started INIT_FS: wait until the application has closed it.
			reset_settle $::sbc_disarm_timeout_ms $::sbc_init_fs_ms
		}
		if {![llength [suspend pending locked]]} {
			return
		}
	}
	echo "Warning: [suspend pending locked] without suspend after the reset - a halt will reset the board on resume"
}

# reset halt|init, then keeps the halt through the FS26's resets (see Behaviour in the header).
proc sbc_reset_halt {mode} {
	global sbc_rstb_wired sbc_wired_reset_halt sbc_hold_ms sbc_dfs_max sbc_wired_found
	set cpu0 [tc3xx_cpu0]
	sbc_disarm_first
	set t0 [clock milliseconds]
	sbc_reset_retry $mode
	if {$sbc_rstb_wired eq "0"} {
		# Unwired and disarmed: nothing ends the halt, so it is not watched.
		set ::sbc_assume held
		return
	}
	# Halt again after each FS26 reset only for dfs.
	set rehalt [expr {$sbc_wired_reset_halt eq "dfs"}]
	set n [sbc_hold_through_resets $rehalt $sbc_dfs_max $sbc_hold_ms $t0]
	if {$n == 0} {
		set ::sbc_assume held
		return
	}
	set sbc_wired_found 1
	if {$sbc_wired_reset_halt eq "app"} {
		sbc_reset_run
		if {[halt_all]} {
			echo "Halt at the reset vector lost to the FS26: halted in the application instead (sbc_wired_reset_halt app)"
		}
		return
	}
	# The FS26 stopped resetting (deep fail-safe, debug mode): halt at the reset vector.
	sbc_reset_retry $mode
	if {![sbc_halt_holds $cpu0 $sbc_hold_ms]} {
		return -code error "the halt at the reset vector is still lost after $n FS26 resets"
	}
	set ::sbc_assume debug
	echo [format "Halt at the reset vector holds after %d FS26 resets (%d ms): the FS26 went through deep fail-safe and is in debug mode until the application runs" \
		$n [expr {[clock milliseconds] - $t0}]]
}

# reset $mode, retried every 500 ms for up to 3 s while the board is off (deep fail-safe before its
# auto retry).
proc sbc_reset_retry {mode} {
	for {set off 0} {[sbc_reset_quick $mode err]} {incr off} {
		if {$off >= 6} {
			return -code error "target unreachable for 3 s: the FS26 stays in deep fail-safe (no auto retry?) - power-cycle the board ($err)"
		}
		sleep 500
	}
}

proc sbc_reset_quick {mode errvar} {
	upvar $errvar err
	catch {reset $mode} err
}

# Watches cpu0 after a halting reset until its halt held hold_ms without a reset, counted from t0
# (start of the halting reset) or the last FS26 reset. A reset: STM0 counts from a lower value, or
# reads fail and then find OEN cleared. rehalt 1: halt cpu0 again after each reset; 0: return at the
# first. Returns the number of resets seen.
proc sbc_hold_through_resets {rehalt max_resets hold_ms {t0 ""}} {
	global tc3xx_dbgsr
	set dbgsr $tc3xx_dbgsr([tc3xx_cpu0])
	set n 0
	set prev ""
	set down_since -1
	set fails 0
	sbc_resets_mark
	set held_since [expr {$t0 eq "" ? [clock milliseconds] : $t0}]
	# Already running: the FS26 reset came during the halting reset itself.
	if {[catch {sbc_rd_retry $dbgsr} d] || ($d & 0x6) != 0x2} {
		incr n
		if {!$rehalt} {
			return $n
		}
		catch {mww $dbgsr 0x6}
	}
	while 1 {
		set now [clock milliseconds]
		set s [sbc_stm64]
		if {$s eq ""} {
			# Failed reads are a reset only if OEN is cleared once the device answers again: single
			# reads fail now and then through a miniWiggler while the HSM runs.
			if {[incr fails] < 2} {
				sleep 1
				continue
			}
			if {$down_since < 0} {
				set down_since $now
			} elseif {$now - $down_since > 3000} {
				return -code error "target unreachable for 3 s after $n FS26 resets: the FS26 stays in deep fail-safe (no auto retry?) - power-cycle the board"
			}
			sleep 1
			continue
		}
		set fails 0
		set reset [expr {$prev ne "" && $s < $prev}]
		if {$down_since >= 0} {
			if {[sbc_reset_cleared_oen]} {
				set reset 1
			}
			set down_since -1
		}
		if {$reset} {
			incr n
			if {!$rehalt} {
				return $n
			}
			if {$n > $max_resets} {
				return -code error "the FS26 still resets the board after $max_resets resets"
			}
			catch {mww $dbgsr 0x6}
			set held_since $now
			set s [sbc_stm64]
		}
		set prev $s
		if {$now - $held_since >= $hold_ms} {
			if {![catch {sbc_rd_retry $dbgsr} d] && ($d & 0x6) == 0x2} {
				return $n
			}
			# Not halted: a reset slipped through. Counted, and halted again.
			incr n
			if {!$rehalt} {
				return $n
			}
			catch {mww $dbgsr 0x6}
			set held_since $now
		}
		sleep 2
	}
}

# --- Reset detection ---------------------------------------------------------------------------------

# STM0 as one 64-bit value (reading TIM0 latches bits 63:32 into CAP), "" if it cannot be read. TIM0
# alone wraps every ~43 s at 100 MHz, which would look like a reset.
proc sbc_stm64 {} {
	if {[catch {
		set lo [tc3xx_rd 0xF0001010]
		set hi [tc3xx_rd 0xF000102C]
	}]} {
		return ""
	}
	expr {($hi << 32) | $lo}
}

# tc3xx_rd with up to 3 tries: single accesses fail now and then through a miniWiggler while the HSM
# runs.
proc sbc_rd_retry {addr} {
	for {set i 1} {1} {incr i} {
		if {![catch {tc3xx_rd $addr} v]} {
			return $v
		}
		if {$i >= 3} {
			return -code error $v
		}
		sleep 1
	}
}

# Whether reads that failed for a while were a reset: the device watch counted one since
# sbc_resets_mark, or OSTATE.OEN is cleared. Neither: probe noise.
proc sbc_reset_cleared_oen {} {
	global sbc_resets_seen
	set n [dict get [reset_info] count]
	if {[info exists sbc_resets_seen] && $n != $sbc_resets_seen} {
		set sbc_resets_seen $n
		return 1
	}
	expr {[catch {sbc_rd_retry $::tc3xx_reg(OSTATE)} os] || !($os & 1)}
}

# Start of a reset watch loop: only resets from now on count in sbc_reset_cleared_oen.
proc sbc_resets_mark {} {
	set ::sbc_resets_seen [dict get [reset_info] count]
}

# 1 if $t still shows halted on a read after $ms ms. Three failed DBGSR reads in a row, or a failed
# read at the end of the window, count as a lost halt.
proc sbc_halt_holds {t ms} {
	global tc3xx_dbgsr
	set t0 [clock milliseconds]
	set errors 0
	while 1 {
		set failed [catch {tc3xx_rd $tc3xx_dbgsr($t)} dbgsr]
		set late [expr {[clock milliseconds] - $t0 >= $ms}]
		if {$failed} {
			if {[incr errors] >= 3 || $late} {
				return 0
			}
		} elseif {($dbgsr & 0x6) != 0x2} {
			return 0
		} elseif {$late} {
			return 1
		} else {
			set errors 0
		}
		sleep 5
	}
}

# --- Events (cpu0) -----------------------------------------------------------------------------------

# examine-end after a reset outside the policy (application or FS26 reset): the watchdog state
# becomes unknown if OCDS was found off; warns about modules locked before their suspend.
proc sbc_on_examine {} {
	global sbc_attached sbc_busy sbc_disarmed
	if {![info exists sbc_attached] || $sbc_busy} {
		return
	}
	if {[sbc_ocds_lost] && $sbc_disarmed} {
		sbc_set_unknown "OCDS was off after a reset the debugger did not see through"
		echo "Note: OCDS was off after a reset - the application may have started without the debugger; FS26 watchdog [sbc_state_text]. The next reset disarms it again."
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		echo "Warning: reset detected; $stm got no suspend before the application locked them - a halt now resets the board on resume (a reset fixes it)"
	}
}

# halted: while the watchdog is not known to be disarmed, watches the halt for sbc_armed_check_ms.
# Held: disarmed. FS26 reset: waits until the application has disarmed it, then halts the cores again.
proc sbc_on_halted {} {
	global sbc_busy sbc_recovery_failed sbc_armed_check_ms
	# A failed recovery is not tried again before the next resume.
	if {$sbc_busy || $sbc_recovery_failed} {
		return
	}
	if {![sbc_known_disarmed]} {
		set sbc_busy 1
		set r [reset_settle $sbc_armed_check_ms $sbc_armed_check_ms]
		if {[dict get $r settled] && [dict get $r resets] == 0} {
			set sbc_busy 0
			if {[[tc3xx_cpu0] curstate] eq "halted"} {
				sbc_set_disarmed "a halt held for $sbc_armed_check_ms ms"
			}
		} else {
			echo "Warning: the FS26 reset the board after the halt (watchdog armed) - re-attached; the application disarms it now, then the cores are halted again."
			if {[sbc_wait_disarmed "the application restarted with the debugger attached"]} {
				halt_all
			} else {
				set sbc_recovery_failed 1
			}
			sbc_ocds_lost
			set sbc_busy 0
			return
		}
	}
	set stm [suspend pending locked]
	if {[llength $stm]} {
		echo "Warning: halted with $stm not suspended - the OS will panic on resume and reset the board (reset first)"
	}
}

# resume-end: resuming from a policy reset halt starts the application with the debugger attached,
# which disarms the watchdog.
proc sbc_on_resumed {} {
	global sbc_assume
	if {$sbc_assume ne "" && !$::sbc_disarmed} {
		sbc_set_disarmed "the application started from the halting reset with the debugger attached"
	}
	set sbc_assume ""
	set ::sbc_recovery_failed 0
}

# monitor sbc_status: attach mode, wiring, watchdog state.
proc sbc_status {} {
	global sbc_rstb_wired sbc_wired_reset_halt
	echo [format "attach mode %s; debugger reset on FS26 RSTB: %s (setting %s); halt not held: %s" \
		[attach_mode] [expr {[sbc_wired] ? "yes" : "not seen"}] $sbc_rstb_wired $sbc_wired_reset_halt]
	echo "FS26 watchdog: [sbc_state_text]"
}

add_help_text sbc_status "Show the attach mode, whether the debugger reset is on the FS26 RSTB, and the FS26 watchdog state (fs26_sbc.cfg)."
add_usage_text sbc_status ""
