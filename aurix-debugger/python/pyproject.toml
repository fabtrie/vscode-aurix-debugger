[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aurix-dbg"
version = "0.2.0"
description = "Python client of the aurix-dbg AURIX debug server (REST API)"
requires-python = ">=3.8"
dependencies = ["requests", "websocket-client"]

[tool.setuptools]
packages = ["aurix_dbg"]
