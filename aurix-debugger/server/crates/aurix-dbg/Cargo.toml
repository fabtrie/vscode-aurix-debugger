[package]
name = "aurix-dbg"
description = "OpenOCD-compatible AURIX debug server over Infineon TAS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aurix-core.workspace = true
jim.workspace = true
tcf.workspace = true
api = { workspace = true, optional = true }

[features]
default = ["api"]
# REST API and DAQ WebSocket (`api_port`) and the registration with the hub.
api = ["dep:api"]

[dev-dependencies]
# End-to-end tests of the hub with real worker processes (tests/hub.rs).
hub.workspace = true
api-spec.workspace = true
openocd-tcl.workspace = true
serde_json.workspace = true
tungstenite = "0.29"
