[package]
name = "mcds"
description = "AURIX miniMCDS trace: register setup and decoders for data and program trace (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_tricore"], optional = true }

[dev-dependencies]
object.workspace = true
serde_json.workspace = true

[features]
default = []
# TriCore instruction lookup with Capstone for the program trace flow (flow::CapstoneCode).
capstone = ["dep:capstone"]
