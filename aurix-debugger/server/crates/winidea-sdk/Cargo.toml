[package]
name = "winidea-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust bindings for the iSYSTEM winIDEA SDK (isystem.connect)"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
# The SDK is loaded at RUNTIME, exactly like vector-driver loads vxlapi64.dll.
# Nothing is linked at build time, so this crate compiles anywhere -- including
# CI and non-Windows hosts -- without isystemConnect.dll being present.
libloading = "0.8"
