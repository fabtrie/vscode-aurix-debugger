# Example board cfg: a TC375 Lite Kit, or any TC3xx board without a safety SBC. Load it after the board
# cfg:
#   "configFiles": ["board/infineon/kit_a2g_tc375_lite.cfg", "tc375_lite_example.cfg"]
# The attach mode goes in launch.json, before init: "configCommands": ["attach_mode halt", "init"]
#
# No SBC file is loaded: resets and halts are the server's own. All cores halt, resume and step
# together (TL1); "ocds sync none" after the script below lets each core run alone.

script [file join [file dirname [info script]] tc3xx_ocds.cfg]

# The STMs of the cores stop while the cores are halted (OS timers do not advance). Add the modules
# your application needs stopped too, by their SVD names, e.g. "suspend add CAN0".
suspend add cores
