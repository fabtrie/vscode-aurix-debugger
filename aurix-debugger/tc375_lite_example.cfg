# Example board cfg for a TC3xx board without a safety SBC, e.g. the TC375 Lite Kit. Copy and adapt.
# Load it after the board cfg; set the attach mode before init (launch.json):
#   "configFiles": ["board/infineon/kit_a2g_tc375_lite.cfg", "tc375_lite_example.cfg"]
#   "configCommands": ["attach_mode halt", "init"]
# All cores halt, resume and step together (TL1); add "ocds sync none" after the script line to let
# each core run alone. Settings: see the header of tc3xx_ocds.cfg.

script [file join [file dirname [info script]] tc3xx_ocds.cfg]

# Peripherals stopped while the cores are halted, by SVD name. cores: the STMs of the cores (OS timers
# stop). Add what your application needs, e.g. "suspend add CAN0".
suspend add cores
