# Example board cfg for a TC37x board with an NXP FS26 safety SBC. Copy and adapt.
# Load it after the board cfg; set the attach mode before init (launch.json):
#   "configFiles": ["board/infineon/kit_a2g_tc375_lite.cfg", "tc37x_fs26_example.cfg"]
#   "configCommands": ["attach_mode halt", "init"]
#   attach_mode passive|hot|halt|reset_halt|reset_run, default hot (help attach_mode)
#
# The TC375 Lite board cfg also fits a TC377 (JTAG ID 0x10207083). kit_a2g_tc377tx_3v3_trb.cfg loads
# tc37x_EXT.cfg (ID 0x10208083), which aurix-dbg refuses on such a chip over TAS.

# DAP clock in kHz; 30 MHz is the miniWiggler V3 maximum. Lower it if the connection is unreliable.
adapter speed 30000

# FS26 reset and halt policy (fs26_sbc.cfg, settings listed there). Reset wiring is detected (auto);
# "set sbc_rstb_wired 1" if the debugger reset is on the FS26 RSTB (skips the disarming running reset),
# "set sbc_rstb_wired 0" if not (skips the watch of each halting reset).
set tc3xx_sbc fs26

# The HSM as a debug target, halted and resumed with the cores:
#   set tc3xx_hsm_target 1

# GTM MCS channels as targets, e.g. MCS0 and MCS1 (may also be set in configCommands before init):
#   set tc3xx_mcs_modules {0 1}

script [file join [file dirname [info script]] tc3xx_ocds.cfg]

# Peripherals stopped while the cores are halted, by SVD name; cores = the STMs of the cores. A
# peripheral that runs on through a halt can make the application see a timeout or safety error after
# the resume and reset the board. Modes: soft (default), hard (clock stopped; the only mode of GPT12),
# off (writes SUS=0). Add your application's, e.g.:
#   suspend add EVADC
#   suspend add GPT120 hard
#   suspend add GTM off
suspend add cores

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
