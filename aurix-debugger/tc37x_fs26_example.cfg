# Example board cfg: a TC37x board with an NXP FS26 safety SBC. Copy it for your board and application.
# Load it after the board cfg:
#   "configFiles": ["board/infineon/kit_a2g_tc375_lite.cfg", "tc37x_fs26_example.cfg"]
#
# The TC375 Lite board cfg also fits a TC377: it loads target/infineon/tc37x.cfg, whose JTAG ID
# (0x10207083) is the one a TC377 reports. OpenOCD's kit_a2g_tc377tx_3v3_trb.cfg loads
# tc37x_EXT.cfg (0x10208083), which aurix-dbg refuses on such a chip over TAS.
#
# The attach mode goes in launch.json, before init:
#   "configCommands": ["attach_mode halt", "init"]
#   passive | hot (default) | halt | reset_halt | reset_run  (help attach_mode)

# DAP clock: the miniWiggler V3 handles up to 30 MHz (on a TC377 board without a single mismatch,
# 5 x 5.9 MB compared, 3 program/verify cycles). Lower it if connections get unreliable (longer cable,
# other board).
adapter speed 30000

# The FS26 reset and halt policy (fs26_sbc.cfg; its settings are listed there). The reset wiring needs
# no setting (auto): a halting reset is repeated until it holds, which on a board with the debugger
# reset on the FS26 RSTB means until deep fail-safe. "set sbc_rstb_wired 1" saves a disarming running
# reset there; "set sbc_rstb_wired 0" (the debugger reset does not reach the FS26) saves the ~400 ms
# watch of each halting reset.
set tc3xx_sbc fs26

# The HSM as a core to debug (halted and resumed with the TriCore cores). Its release after a reset
# needs no setting.
#   set tc3xx_hsm_target 1

# GTM MCS channels as targets, e.g. MCS0 and MCS1 (also in a launch configuration's configCommands):
#   set tc3xx_mcs_modules {0 1}

script [file join [file dirname [info script]] tc3xx_ocds.cfg]

# Peripherals to suspend while the cores are halted, as winIDEA's SuspendPeripheralsWhileStopped (an
# application whose peripherals run on through a halt can see a timeout or a safety error after the
# resume and reset the board). The server writes each module's OCS as soon as the module allows it:
# right after every reset, and while the cores run once the application has enabled it. By their SVD
# names; here the STMs of the cores. Add your application's, e.g.:
#   suspend add EVADC
#   suspend add GPT120 hard
#   suspend add GTM off
suspend add cores

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
