# TC377 TRB board with the app application: board and application settings on top of the
# generic TC3xx OCDS setup in tc3xx_ocds.cfg (multi-core break, STM suspend, HSM and MCS targets).
# Load after the board cfg: -f board/infineon/kit_a2g_tc377tx_3v3_trb.cfg -f tc37x_ocds_init.cfg
#
# For another board or derivative, copy this file, change the chip name passed to tc3xx_ocds_setup
# (CHIPNAME of the target cfg) and the settings below.

# DAP clock: the board cfg sets 5 MHz. The miniWiggler V3 supports up to 30 MHz; on the TC377 board
# 30 MHz read and programmed without a single mismatch (5 x 5.9 MB compared, 3 program/verify
# cycles) and reads 1.9 MB in 1.1 s instead of 4.3 s. Lower it if connections get unreliable
# (longer cable, other board).
adapter speed 30000

# DFLASH0 (NVM/Fee data; 256 KB on the TC377, erase commands beyond it fail with SQER) and DFLASH1
# (HSM data), for erasing them: "flash erase_sector dfls0 0 last" after "reset init".
# The target cfg only defines the PFLASH banks.
flash bank dfls0 tc3x_eflash 0xAF000000 0x40000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 tc37x.cpu0

# The application runs MCS0 and MCS1 (aurix-dbg only). Set tc3xx_mcs_modules {} in a cfg before
# this one to leave them out, tc3xx_hsm_target 0 to leave out the HSM.
if {![info exists tc3xx_mcs_modules]} {
	set tc3xx_mcs_modules {0 1}
}

# STM0/1 suspend: the app's PeriphCheck (bsw/Libraries/Safety/src/PeriphCheck.c) restricts
# STM0_ACCEN0 to CPU0 and STM1_ACCEN0 to CPU1, so after "reset run" the debugger's STM0/1_OCS writes
# are refused; connect with tc3xx_connect_reset_halt to get them. STM2 is not restricted.
#
# HSM: the bootloader waits for the HSM (PROCONHSMCFG.SSWWAIT, HSM2HTS), so after a halting reset
# the HSM is started before cpu0 runs (tc3xx_hsm_autostart, like the app winIDEA
# InitSeq_HsmAutoStart.ini). Without it cpu1 is never started.
#
# The SBC watchdog resets the board when the cores are halted for too long, hence the retries of
# tc3xx_connect_reset_halt.

script [file join [file dirname [info script]] tc3xx_ocds.cfg]
tc3xx_ocds_setup tc37x

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
