# TC37x board with an application and an NXP FS26 SBC: board settings on top of the chip
# mechanics (tc3xx_ocds.cfg) and the FS26 attach/reset policy (fs26_sbc.cfg).
# Load after the board cfg: -f board/infineon/kit_a2g_tc375_lite.cfg -f tc37x_ocds_init.cfg
#
# The TC375 Lite board cfg is deliberate: it loads target/infineon/tc37x.cfg, whose JTAG ID
# (0x10207083) is the one this TC377 reports. OpenOCD's kit_a2g_tc377tx_3v3_trb.cfg loads
# tc37x_EXT.cfg (0x10208083), which aurix-dbg refuses on this chip over TAS.
#
# Choose the attach mode in launch.json, before init:
#   "configCommands": ["set sbc_attach_mode halt", "init"]
#   passive | hot (default) | halt | reset_halt | reset_run - see fs26_sbc.cfg
# The reset wiring needs no setting (auto): a halting reset is repeated until it holds, which on a
# board with the debugger reset on the FS26 RSTB means until deep fail-safe. "set sbc_rstb_wired 1"
# saves a disarming running reset there; "set sbc_rstb_wired 0" forbids repeating a lost halt.

# Settings below apply unless set before this file (launch.json "-c" commands come after it, so set
# those before "init"). Same helper as in tc3xx_ocds.cfg, which is loaded at the end.
proc tc3xx_default {name value} {
	global $name
	if {![info exists $name]} {
		set $name $value
	}
}

# DAP clock: the miniWiggler V3 handled 30 MHz on this board without a single mismatch (5 x 5.9 MB
# compared, 3 program/verify cycles). Lower it if connections get unreliable.
adapter speed 30000

# DFLASH0 (NVM/Fee data, 256 KB on the TC377) and DFLASH1 (HSM data), for erasing them:
# "flash erase_sector dfls0 0 last" after "reset init". The target cfg only defines the PFLASH banks.
flash bank dfls0 tc3x_eflash 0xAF000000 0x40000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 tc37x.cpu0

# The application runs MCS0 and MCS1 (aurix-dbg only).
tc3xx_default tc3xx_mcs_modules {0 1}

# Peripherals the application uses, suspended while the cores are halted (as winIDEA's
# SuspendPeripheralsWhileStopped; with them running on, the application's ADC driver reports a safety
# error after a halt and resets the board). Measured with probe/ocs_probe.tcl:
#   reset  writable right after a reset (enabled by default): SMU (STM0-2 are added by tc3xx_setup)
#   app    disabled after a reset, writable once the application has enabled them
# All other modules stay disabled (CLC.DISS) in this application and refuse the write. GPT12 has hard
# suspend (1) only. Entries: {name OCS CLC ACCEN0 sus class}, addresses from probe/ocs_list.tcl; the
# scripts write OCS only while CLC and ACCEN0 allow it (a refused write resets the board).
tc3xx_default tc3xx_periph {
	{SMU      0xF0036FE8 0xF0036800 0xF0036FFC 2 reset}
	{GPT120   0xF00018E8 0xF0001800 0xF00018FC 1 app}
	{QSPI2    0xF0001EE8 0xF0001E00 0xF0001EFC 2 app}
	{QSPI4    0xF00020E8 0xF0002000 0xF00020FC 2 app}
	{EVADC    0xF0020028 0xF0020000 0xF002003C 2 app}
	{CONVCTRL 0xF0025028 0xF0025000 0xF002503C 2 app}
	{GTM      0xF019FD38 0xF019FD00 0xF019FD10 2 app}
	{CAN0     0xF02080E8 0xF0208000 0xF02080FC 2 app}
	{CAN1     0xF02180E8 0xF0218000 0xF02180FC 2 app}
}

# Disarm check for the running build. The addresses change with every build:
#   SBC driver state (byte 0)            != 0           the FS26 driver has initialized the SBC
#                                                       (first: if not, the state is unknown)
#   debugger flag                        == 0xDEB00001  ... and the application saw the debugger
# Without a check the policy waits sbc_disarm_delay_ms after a reset instead.
tc3xx_default sbc_disarm_check {
	{0x6000F000 0x000000FF != 0}
	{0x7000F000 0xFFFFFFFF == 0xDEB00001}
}

script [file join [file dirname [info script]] tc3xx_ocds.cfg]
tc3xx_setup tc37x
script [file join [file dirname [info script]] fs26_sbc.cfg]
sbc_setup

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
