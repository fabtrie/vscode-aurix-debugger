# Example board cfg: a TC37x board with an NXP FS26 SBC. Board settings on top of the chip mechanics
# (tc3xx_ocds.cfg) and the FS26 attach/reset policy (fs26_sbc.cfg).
# Load after the board cfg: -f board/infineon/kit_a2g_tc375_lite.cfg -f tc37x_ocds_init.cfg
#
# Copy it for your board and application, or keep it and put your settings in a cfg of your own that
# sets them and then loads this one (settings made before this file win):
#   set sbc_disarm_check {...}
#   set tc3xx_periph {...}
#   script [file join [file dirname [info script]] tc37x_ocds_init.cfg]
#
# The TC375 Lite board cfg also fits a TC377: it loads target/infineon/tc37x.cfg, whose JTAG ID
# (0x10207083) is the one a TC377 reports. OpenOCD's kit_a2g_tc377tx_3v3_trb.cfg loads
# tc37x_EXT.cfg (0x10208083), which aurix-dbg refuses on such a chip over TAS.
#
# Choose the attach mode in launch.json, before init:
#   "configCommands": ["set sbc_attach_mode halt", "init"]
#   passive | hot (default) | halt | reset_halt | reset_run - see fs26_sbc.cfg
# The reset wiring needs no setting (auto): a halting reset is repeated until it holds, which on a
# board with the debugger reset on the FS26 RSTB means until deep fail-safe. "set sbc_rstb_wired 1"
# saves a disarming running reset there; "set sbc_rstb_wired 0" forbids repeating a lost halt.

# Settings below apply unless set before this file (launch.json "-c" commands come after it, so set
# those before "init"). Same helper as in tc3xx_ocds.cfg, which is loaded at the end.
proc tc3xx_default {name value} {
	global $name
	if {![info exists $name]} {
		set $name $value
	}
}

# DAP clock: the miniWiggler V3 handles up to 30 MHz (on a TC377 board without a single mismatch,
# 5 x 5.9 MB compared, 3 program/verify cycles). Lower it if connections get unreliable (longer
# cable, other board).
adapter speed 30000

# DFLASH0 (NVM/Fee data, 256 KB on the TC377) and DFLASH1 (HSM data), for erasing them:
# "flash erase_sector dfls0 0 last" after "reset init". The target cfg only defines the PFLASH banks.
flash bank dfls0 tc3x_eflash 0xAF000000 0x40000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 tc37x.cpu0

# GTM MCS channels as targets (aurix-dbg only), off by default. "set tc3xx_mcs_modules {0 1}" (before
# this file, or in a launch configuration's configCommands) debugs MCS0 and MCS1.
tc3xx_default tc3xx_mcs_modules {}

# Peripherals to suspend while the cores are halted, as winIDEA's SuspendPeripheralsWhileStopped.
# An application whose peripherals run on through a halt can see a timeout or a safety error after the
# resume and reset the board. Which modules can be suspended depends on the application: a module
# that is disabled (CLC.DISS) or whose ACCEN0 locks out the debugger refuses the write, and a refused
# write can reset the board, so the scripts write OCS only while CLC and ACCEN0 allow it.
# Entries: {name OCS CLC ACCEN0 sus class}; addresses from the device's SVD (<module>_OCS, _CLC, _ACCEN0)
#   sus    2 soft suspend (the module finishes what it is doing), 1 hard suspend (clock stopped,
#          the only one GPT12 has), 0 not suspended (also clears a suspend an earlier session left)
#   class  reset: writable right after a reset (STM0-2 are added by tc3xx_setup)
#          app:   disabled after a reset, writable once the application has enabled them
# Default: none besides the STMs. For example:
#   set tc3xx_periph {
#   	{SMU   0xF0036FE8 0xF0036800 0xF0036FFC 2 reset}
#   	{EVADC 0xF0020028 0xF0020000 0xF002003C 2 app}
#   	{CAN0  0xF02080E8 0xF0208000 0xF02080FC 2 app}
#   }
tc3xx_default tc3xx_periph {}

# Disarm check (fs26_sbc.cfg): {{addr mask op value} ...}, all true = the application has disarmed
# the FS26 watchdog; op is == != or >=. Addresses of application variables, from the ELF of the
# running build (they change with every build). The first entry tells whether the application got
# that far at all. Empty: fs26_sbc.cfg waits sbc_disarm_delay_ms after a reset instead. For example:
#   set sbc_disarm_check {
#   	{0x70001000 0x000000FF != 0}            ;# SBC driver state: the FS26 is initialized
#   	{0x70001004 0xFFFFFFFF == 0x12345678}   ;# flag the application sets when it saw the debugger
#   }
tc3xx_default sbc_disarm_check {}

script [file join [file dirname [info script]] tc3xx_ocds.cfg]
tc3xx_setup tc37x
# On a board without an FS26, leave out these two lines.
script [file join [file dirname [info script]] fs26_sbc.cfg]
sbc_setup

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
