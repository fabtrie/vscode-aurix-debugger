# OCDS multi-core setup for the TC37x, equivalent to app/Tools/WinIdea/TC_37x_OCDS_Initialization.ini.
# Addresses from MCAL TC37xA IfxCbs_reg.h / IfxStm_reg.h and the TC37XPD SVD.
#
# The multi-core break runs on the MCU (OTGS trigger line TL1), not in OpenOCD - a software sync
# lags one poll plus several TAS round trips, long enough for the other cores to trigger a reset.
#  - CBS_TRCx.BT1: BRKOUT of every CPU (and the HSM) is routed to TL1. A breakpoint (TRxEVT
#    EVTA=2 "halt and pulse BRKOUT") therefore activates TL1 in the same cycle.
#  - CBS_TLCHE.TL1: capture-and-hold, so the BRKOUT pulse keeps TL1 active.
#  - CBS_TL1ST=0xB000003F: CPU0-5, HSSL0, DMA and HSM are TL1 suspend targets - all of them stop
#    while TL1 is active.
#  - gdb pause: a DBGSR halt write is not a debug event and pulses no BRKOUT. With
#    "tricore tl1_halt on", OpenOCD's tricore_halt() first pulses TL1 through CBS_TLC
#    (third_party/openocd/BUILD_NOTES.md #10), so a pause also stops every core in the same cycle.
#  - continue: resume-start releases the other cores' debug halt (they stay suspended by the held
#    TL1), OpenOCD releases its own core, resume-end clears the TL1 hold (CBS_TLCHS) and all cores
#    start in the same cycle.
#  - single step (aurix-dbg, "tricore tl1_step on"): step-start releases the other cores' debug halt
#    while the latched TL1 still holds them; aurix-dbg releases the stepping core and then clears the
#    hold, so all cores run for the one instruction and the step's BRKOUT stops all of them in the
#    same cycle.
#    Without tl1_step (OpenOCD): the other cores are put into a debug halt, then the hold is cleared
#    so only this core executes; the step's breakpoint event latches TL1 again.
#  - STMs: an STM with OCS.SUS=2 stops while its CPU is suspended by TL1 or has DBGSR.SUSP set
#    (measured on the TC377). "tc37x_step_timers run" (default) leaves SUSP clear, so the STMs stop
#    and run exactly with the cores - also during a TL1-gated step. "frozen" asserts SUSP while
#    halted, so the STMs also stay stopped while a step executes.
# A core stopped by another core's break is reported to gdb as SIGTRAP (BUILD_NOTES #8), which
# VS Code shows as a plain pause instead of "Exception has occurred. Interrupt".
#
# All logic lives in procs: event bodies are not guaranteed to run at global level.

# DAP clock: the board cfg sets 5 MHz. The miniWiggler V3 supports up to 30 MHz; on the TC377 board
# 30 MHz read and programmed without a single mismatch (5 x 5.9 MB compared, 3 program/verify
# cycles) and reads 1.9 MB in 1.1 s instead of 4.3 s. Lower it if connections get unreliable
# (longer cable, other board).
adapter speed 30000

# DFLASH0 (NVM/Fee data; 256 KB on the TC377, erase commands beyond it fail with SQER) and DFLASH1
# (HSM data), for erasing them: "flash erase_sector dfls0 0 last" after "reset init".
# The target cfg only defines the PFLASH banks.
flash bank dfls0 tc3x_eflash 0xAF000000 0x40000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 tc37x.cpu0

set tc37x_cores {tc37x.cpu0 tc37x.cpu1 tc37x.cpu2}
# DBGSR = -dbgbase (tc37x.cfg) + 0x1FD00
array set tc37x_dbgsr {tc37x.cpu0 0xF881FD00 tc37x.cpu1 0xF883FD00 tc37x.cpu2 0xF885FD00}

# HSM (Cortex-M3) as debug target, aurix-dbg only: accessed through the HSM bridge debug window
# (DBGBASE 0xF0041010, window 0xF0050000), which works only while the HSM firmware enables HSM
# debugging. The HSM is a TL1 suspend target and its BRKOUT is routed to TL1 (tc37x_on_examine), so
# it halts and resumes together with the TriCore cores:
#  - HSM breakpoint or pause (tl1_halt): TL1 stops the TriCore cores.
#  - TriCore halt: the TL1 edge halts the HSM through its break-in.
#  - continue of any core: resume-start releases the HSM and the other cores, resume-end clears the
#    TL1 hold.
#  - HSM single step: only the HSM executes (it runs while TL1 holds the TriCore cores).
# The target is created before "init"; set tc37x_hsm_target 0 in a cfg before this one to leave it out.
if {![info exists tc37x_hsm_target]} {
	set tc37x_hsm_target [string match "aurix-dbg*" [version]]
}
if {$tc37x_hsm_target} {
	target create tc37x.hsm cortex_m -coreid 6 -ocmts tc3xx
	targets tc37x.cpu0
}

# GTM MCS channels as debug targets, aurix-dbg only: tc37x.mcs<m>.ch<x> for every channel of the
# MCS modules in tc37x_mcs_modules (the application uses MCS0 and MCS1). The MCS has no debug
# hardware: aurix-dbg stops a channel through its enable bit and sets breakpoints as self-jumps in the
# MCS RAM. The channels are examined once the application enabled the GTM, and are listed by the
# frontends only after they ran. Breakpoints and halts stop only their channel (see tc37x_mcs_halt_all).
# set tc37x_mcs_modules {} in a cfg before this one to leave them out.
if {![info exists tc37x_mcs_modules]} {
	set tc37x_mcs_modules [expr {[string match "aurix-dbg*" [version]] ? "0 1" : ""}]
}
set tc37x_mcs_targets {}
foreach m $tc37x_mcs_modules {
	for {set x 0} {$x < 8} {incr x} {
		target create tc37x.mcs$m.ch$x gtm_mcs -module $m -channel $x -coreid [expr {0x40 + 8 * $m + $x}]
		lappend tc37x_mcs_targets tc37x.mcs$m.ch$x
	}
}
if {[llength $tc37x_mcs_targets]} {
	targets tc37x.cpu0
}

proc tc37x_mww {name addr val} {
	if {[catch {mww $addr $val} err]} {
		echo "Warning: $name <- [format 0x%08x $val] failed: $err"
	}
}

proc tc37x_others {self} {
	global tc37x_cores
	set others {}
	foreach t $tc37x_cores {
		if {$t ne $self} { lappend others $t }
	}
	return $others
}

# STMx (OCS.SUS=2) is suspended while CPUx is suspended by TL1 (DBGSR.SIH=1) or its suspend-out
# DBGSR.SUSP is set (measured on the TC377 with raw writes: TL1 halt with SUSP=0 stops all STMs, also
# the one of a boot-halted CPU; SUSP=1 on a running CPU stops its STM; clearing the TL1 hold restarts
# them). DBGSR.SUSP (bit 4, rw) is written by every DBGSR write; HALT[2:1]=00 leaves the halt state
# unchanged. A debug event loads SUSP from the event's own SUSP bit (TRxEVT.SUSP), a TL1 halt does not
# change it (EXEVT.SUSP has no effect there).
proc tc37x_susout {t on} {
	global tc37x_dbgsr
	tc37x_mww "$t DBGSR.SUSP" $tc37x_dbgsr($t) [expr {$on ? 0x00000010 : 0x00000000}]
}

# The app's PeriphCheck (bsw/Libraries/Safety/src/PeriphCheck.c) restricts STM0_ACCEN0
# to CPU0 and STM1_ACCEN0 to CPU1, so once it has run, debugger writes to STM0/1_OCS fail with a
# bus error ("Read/write access was not completely successful"). Right after a reset ACCEN0 is
# still open and the write lands (OCS keeps it). Each write is caught so one locked STM does not
# skip the others (STM2 is not restricted).
proc tc37x_stm_ocs_init {} {
	foreach {name ocs_addr accen_addr} {
		STM0 0xF00010E8 0xF00010FC
		STM1 0xF00011E8 0xF00011FC
		STM2 0xF00012E8 0xF00012FC
	} {
		if {[catch {mww $ocs_addr 0x12000000}]} {
			set accen "?"
			catch {set accen [format 0x%08x [lindex [read_memory $accen_addr 32 1] 0]]}
			echo "Warning: ${name}_OCS write refused (${name}_ACCEN0=$accen) - app locked it; suspend applies after the next reset"
		} elseif {([lindex [read_memory $ocs_addr 32 1] 0] & 0x0F000000) == 0} {
			echo "Warning: ${name}_OCS write did not stick"
		} else {
			echo "${name} suspend (OCS.SUS=2) applied"
		}
	}
}

proc tc37x_on_examine {} {
	global tc37x_cores
	# A warm reset keeps OCDS/CBS state (no "[OCMTS] Debug (OCDS) enabled" on re-examine). A TL1
	# force or a latched TL1 hold left over from before the reset keeps every core suspended while
	# it boots, and the SBC watchdog then fires a second (PORST) reset. Drop both first.
	tc37x_mww CBS_TLC   0xF0000490 0x00000000 ;# no TL1 force
	tc37x_mww CBS_TLCHS 0xF000049C 0x00000002 ;# clear a latched TL1 hold
	foreach t $tc37x_cores { tc37x_susout $t 0 }

	# MCU-side multi-core break. The winIDEA ini also pulses TL1 via CBS_TLC at this point - left
	# out on purpose: with capture-and-hold enabled that would suspend every core right away.
	tc37x_mww CBS_TL1ST 0xF0000494 0xB000003F ;# CPU0-5, HSSL0, DMA, HSM are TL1 suspend targets
	tc37x_mww CBS_TRC0  0xF0000420 0x00000100 ;# BT1: CPU0 BRKOUT -> TL1
	tc37x_mww CBS_TRC1  0xF0000424 0x00000100 ;# BT1: CPU1 BRKOUT -> TL1
	tc37x_mww CBS_TRC2  0xF0000428 0x00000100 ;# BT1: CPU2 BRKOUT -> TL1
	tc37x_mww CBS_TRHSM 0xF0000438 0x00000100 ;# BT1: HSM BRKOUT -> TL1
	tc37x_mww CBS_TLCHE 0xF0000498 0x00000002 ;# TL1 capture-and-hold

	tc37x_stm_ocs_init

	# The GTM (timers, PWM outputs, MCS channels) keeps running while the cores are halted. Uncomment to
	# soft-suspend it (GTM_OCS.SUS=2) while TL1 holds the cores; the GTM outputs then keep their level.
	# Measured on the TC377: OCS.SUSSTA is set while TL1 holds the cores, the TBU time base and the MCS
	# channels stop. The application reset the device right after the continue of a ~100 ms halt with the
	# GTM suspended (not seen without it). GTM_OCS is only cleared by a debug reset: write 0x10000000
	# to switch the suspend off again.
	# tc37x_mww GTM_OCS 0xF019FD38 0x12000000
}

# STMs while stepping (aurix-dbg TL1-gated steps):
#  run    - SUSP stays clear: TL1 stops and restarts the STMs together with the cores, so every STM
#           advances while the cores execute a step (default).
#  frozen - SUSP is asserted on every core while halted: the STMs also stay stopped during steps.
# At runtime: monitor tc37x_step_timers frozen|run
set tc37x_step_timers run
proc tc37x_step_timers {{mode ""}} {
	global tc37x_step_timers
	if {$mode ne ""} {
		if {[lsearch -exact {run frozen} $mode] < 0} {
			return -code error "usage: tc37x_step_timers ?run|frozen?"
		}
		set tc37x_step_timers $mode
	}
	return $tc37x_step_timers
}

# DBGSR.SUSP value for halted cores in the current mode.
proc tc37x_halt_susp {} {
	global tc37x_step_timers
	return [expr {$tc37x_step_timers eq "frozen" ? 0x00000010 : 0x00000000}]
}

# Any core halted: TL1 has already stopped all cores and, with them, their STMs. "frozen" also
# asserts every core's suspend-out, so the STMs stay stopped while a step executes.
proc tc37x_on_halted {self} {
	global tc37x_cores
	if {[tc37x_halt_susp]} {
		foreach t $tc37x_cores { tc37x_susout $t 1 }
	}
}

# Before OpenOCD releases $self: release the other cores' debug halt too (HALT[2:1]=10, SUSP=0).
# They and their STMs stay suspended by the held TL1 until resume-end.
proc tc37x_on_resume_start {self} {
	global tc37x_dbgsr
	foreach t [tc37x_others $self] {
		tc37x_mww "$t DBGSR" $tc37x_dbgsr($t) 0x00000004
	}
	if {$self ne "tc37x.hsm"} {
		tc37x_hsm_resume
	}
}

# Releases a halted HSM (breakpoint, pause or TL1 break-in) for a continue of a TriCore core: a
# halted HSM keeps its BRKOUT active, which would latch TL1 again right after resume-end. Clears the
# sticky halt reasons (DFSR) as aurix-dbg does for its own resumes.
proc tc37x_hsm_resume {} {
	global tc37x_hsm_target
	if {!$tc37x_hsm_target} {
		return
	}
	if {[catch {
		mww 0xF0041010 0xE0000000 ;# HSM DBGBASE: HSM debug area 0xE000xxxx at 0xF005xxxx
		set dhcsr [lindex [read_memory 0xF005EDF0 32 1] 0]
	}]} {
		return
	}
	if {$dhcsr & 0x00020000} {
		tc37x_mww "HSM DFSR" 0xF005ED30 0x0000001F
		tc37x_mww "HSM DHCSR" 0xF005EDF0 0xA05F0001 ;# debug key, C_DEBUGEN, C_HALT cleared -> run
	}
}

# After OpenOCD released $self: clear every suspend-out while TL1 still holds the cores, then drop
# the TL1 hold - every core and every STM starts in the same cycle.
proc tc37x_on_resume_end {self} {
	global tc37x_cores
	foreach t $tc37x_cores { tc37x_susout $t 0 }
	tc37x_mww CBS_TLCHS 0xF000049C 0x00000002
}

# Single step of $self.
#  - tl1_step (aurix-dbg): release the other cores' debug halt (HALT[2:1]=10) while the latched TL1
#    still suspends them, and set every core's SUSP for the tc37x_step_timers mode. aurix-dbg
#    releases $self (keeping SUSP, also in the step trigger) and clears the TL1 hold afterwards, so
#    all cores - and in "run" mode all STMs - run for the instruction and the step's BRKOUT stops
#    them in the same cycle.
#  - otherwise (OpenOCD): put the other cores into a real debug halt (HALT[2:1]=11, SUSP=1) so they
#    do not run once the hold is gone, then clear the hold so only $self executes. SUSP=1 on every
#    core keeps the STMs of the debug-halted cores (no longer suspended by TL1) stopped.
# The current setting is queried on every step, so "tricore tl1_step off" at runtime takes effect.
proc tc37x_on_step_start {self} {
	global tc37x_dbgsr
	set gated [expr {![catch {$self tricore tl1_step} mode] && $mode eq "tl1_step on"}]
	if {$gated} {
		set susp [tc37x_halt_susp]
		foreach t [tc37x_others $self] {
			tc37x_mww "$t DBGSR" $tc37x_dbgsr($t) [expr {0x00000004 | $susp}]
		}
		tc37x_mww "$self DBGSR.SUSP" $tc37x_dbgsr($self) $susp
	} else {
		foreach t [tc37x_others $self] {
			tc37x_mww "$t DBGSR" $tc37x_dbgsr($t) 0x00000016
		}
		tc37x_susout $self 1
		tc37x_mww CBS_TLCHS 0xF000049C 0x00000002
	}
}

# A debugger reset (reset run|halt|init, VS Code Reset) clears the STM OCS and does not re-examine,
# so examine-end does not fire (OpenOCD fires it before asserting the reset). Redo the setup at
# reset-end. After a halting reset ACCEN0 is still open, so the STM suspend lands. cpu0 is only
# debug halted and the other cores are in boot halt, which stops no STM: latch TL1 like a pause, so
# every core and STM is suspended until continue releases them (resume-start/resume-end).
# After "reset run" the application locks STM0/1 before this runs (the OCS writes are refused).
#
# HSM: with a debugger connected, the boot ROM puts an on-chip breakpoint on the HSM's first
# instruction (Vector vHsm_IntegrationHints 3.7.3), so after a halting reset the HSM stays halted,
# the bootloader waits for it (HSM2HTS) forever and cpu1 is never started. tc37x_hsm_release
# deletes that breakpoint and runs the HSM (app InitSeq_HsmAutoStart.ini) while cpu0 is still
# halted at its first instruction - no race. Measured on the TC377:
#  - TL1 halts the HSM through its break-in on the TL1 edge and resumes it with the cores, so the
#    HSM is released after TL1 has been latched and then keeps running while the cores are held.
#  - The SSW normally waits for the HSM (PROCONHSMCFG.SSWWAIT); starting the HSM together with cpu0
#    sends the bootloader into its error loop. So wait until HSM2HTS reports READY|ACTIVE (0x3)
#    before cpu0 may run (at most tc37x_hsm_ready_ms).
# If the release fails, the halted HSM's BRKOUT stays active and, routed to TL1, would re-latch the
# hold after every continue: the HSM routing is switched off instead.
# set tc37x_hsm_autostart 0 to leave the HSM halted (debugging the HSM with another tool).
set tc37x_hsm_autostart 1
set tc37x_hsm_ready_ms 2000
proc tc37x_hsm_release {} {
	if {[catch {
		mww 0xF0041010 0xE0000000 ;# HSM DBGBASE: HSM debug area 0xE000xxxx at 0xF005xxxx
		mww 0xF0052008 0x00000000 ;# HSM FP_COMP0: delete the boot ROM breakpoint
		mww 0xF005EDF0 0xA05F0001 ;# HSM DHCSR: debug key, C_DEBUGEN, C_HALT cleared -> run
		set dhcsr [lindex [read_memory 0xF005EDF0 32 1] 0]
	} err]} {
		echo "Warning: HSM not released (HSM debug access: $err)"
		return 0
	}
	if {$dhcsr & 0x00020000} {
		echo [format "Warning: HSM still halted (DHCSR=0x%08x)" $dhcsr]
		return 0
	}
	return 1
}

# Waits until the HSM reports READY|ACTIVE in HSM2HTS, like the SSW does with SSWWAIT.
proc tc37x_hsm_wait_ready {} {
	global tc37x_hsm_ready_ms
	set v 0
	for {set t 0} {$t <= $tc37x_hsm_ready_ms} {incr t 20} {
		catch {set v [lindex [read_memory 0xF0040034 32 1] 0]}
		if {($v & 0x3) == 0x3} {
			return 1
		}
		sleep 20
	}
	echo [format "Warning: HSM not ready after %d ms (HSM2HTS=0x%08x)" $tc37x_hsm_ready_ms $v]
	return 0
}

proc tc37x_on_reset_end {} {
	global tc37x_hsm_autostart
	tc37x_on_examine
	if {[tc37x.cpu0 curstate] eq "halted"} {
		tc37x_mww CBS_TLC 0xF0000490 0x00000030 ;# force TL1: latched by capture-and-hold
		tc37x_mww CBS_TLC 0xF0000490 0x00000000
		# After the TL1 edge, so TL1 does not halt the HSM again.
		if {$tc37x_hsm_autostart && [tc37x_hsm_release]} {
			tc37x_hsm_wait_ready
		} else {
			tc37x_mww CBS_TRHSM 0xF0000438 0x00000000 ;# the halted HSM keeps BRKOUT active
		}
		tc37x_on_halted tc37x.cpu0
	}
}

# Connect with a halting reset (launch.json "configCommands": ["init", "tc37x_connect_reset_halt"]).
# The application locks STM0/1 ACCEN right after start-up, so STM suspend only lands while the cores
# are halted right after a reset. The watchdog can reset the chip again and the halt is lost: cpu0
# must still be halted a moment later, otherwise retry after $delay ms. Only warns when every attempt
# fails, so the debug session still starts.
proc tc37x_connect_reset_halt {{tries 3} {delay 200}} {
	for {set i 1} {$i <= $tries} {incr i} {
		if {[catch {reset halt} err]} {
			echo "Warning: reset halt attempt $i: $err"
		} else {
			sleep 100
			set halted 0
			catch {set halted [expr {[lindex [read_memory 0xF881FD00 32 1] 0] & 0x2}]}
			if {$halted} {
				echo "Connected with reset halt (attempt $i)"
				return
			}
			echo "Warning: reset halt attempt $i: cpu0 no longer halted (watchdog reset?)"
		}
		sleep $delay
	}
	echo "Warning: reset halt failed $tries times - cores not halted after reset"
}

# examine-end fires at init and on every re-examine after a detected reset (OCDS already re-enabled by then).
tc37x.cpu0 configure -event examine-end { tc37x_on_examine }
tc37x.cpu0 configure -event reset-end { tc37x_on_reset_end }

foreach t $tc37x_cores {
	if {[catch {$t tricore tl1_halt on} err]} {
		echo "Warning: $t: 'tricore tl1_halt' not available (OpenOCD not rebuilt?) - pause will not stop the other cores: $err"
	}
	# aurix-dbg: step, step over and step out run with interrupts masked (ICR.IE = 0), like the
	# winIDEA workspace (DisableIRQ_Step/StepOver/RunUntilReturn). Continue runs with them enabled.
	# "tricore irq_mask off" disables it. OpenOCD has no such command, hence the catch.
	catch {$t tricore irq_mask step step_over step_out}
	# aurix-dbg: TL1-gated single step (all cores run for the stepped instruction, see step-start).
	catch {$t tricore tl1_step on}
	$t configure -event halted       "tc37x_on_halted $t"
	$t configure -event resume-start "tc37x_on_resume_start $t"
	$t configure -event resume-end   "tc37x_on_resume_end $t"
	$t configure -event step-start   "tc37x_on_step_start $t"
}

if {$tc37x_hsm_target} {
	# A pause of the HSM also stops the TriCore cores. Steps run with interrupts masked, as on the
	# TriCore cores. No step-start handler: the HSM steps alone while TL1 holds the other cores.
	tc37x.hsm cortex_m tl1_halt on
	tc37x.hsm cortex_m irq_mask step step_over step_out
	tc37x.hsm configure -event halted       "tc37x_on_halted tc37x.hsm"
	tc37x.hsm configure -event resume-start "tc37x_on_resume_start tc37x.hsm"
	tc37x.hsm configure -event resume-end   "tc37x_on_resume_end tc37x.hsm"
}

# An MCS breakpoint stops only its channel: the cores and the other MCS channels keep running.
# tc37x_mcs_halt_all also halts all cores (TL1, like a pause) when a channel stops at a breakpoint or
# a step. Halts of a channel the application disables itself are ignored. Continue the MCS channel
# separately: a TriCore continue does not enable MCS channels.
proc tc37x_mcs_halt_all {self} {
	if {[lsearch -exact {breakpoint single-step} [$self debug_reason]] < 0} {
		return
	}
	tc37x_mww CBS_TLC 0xF0000490 0x00000030 ;# force TL1: latched by capture-and-hold
	tc37x_mww CBS_TLC 0xF0000490 0x00000000
}
# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc37x_mcs_targets {
# 	$t configure -event halted "tc37x_mcs_halt_all $t"
# }

# Diagnostic, while halted: -exec monitor tc37x_stm_status in the VS Code debug console.
proc tc37x_stm_status {} {
	global tc37x_cores tc37x_dbgsr
	set tls [lindex [read_memory 0xF0000470 32 1] 0]
	echo [format "CBS: TLS.TL1=%d  TLC=0x%08x  TL1ST=0x%08x  TLCHE=0x%08x" \
		[expr {($tls >> 1) & 1}] [lindex [read_memory 0xF0000490 32 1] 0] \
		[lindex [read_memory 0xF0000494 32 1] 0] [lindex [read_memory 0xF0000498 32 1] 0]]
	set i 0
	foreach t $tc37x_cores {
		set dbg  [lindex [read_memory $tc37x_dbgsr($t) 32 1] 0]
		set base [expr {0xF0001000 + 0x100 * $i}]
		set ocs  [lindex [read_memory [expr {$base + 0xE8}] 32 1] 0]
		set t1   [lindex [read_memory [expr {$base + 0x10}] 32 1] 0]
		sleep 100
		set t2   [lindex [read_memory [expr {$base + 0x10}] 32 1] 0]
		echo [format "%s DBGSR=0x%08x (HALT=%d SIH=%d SUSP=%d EVTSRC=0x%02x)  STM%d OCS.SUS=%d SUSSTA=%d  TIM0 %s" \
			$t $dbg [expr {($dbg >> 1) & 3}] [expr {($dbg >> 3) & 1}] [expr {($dbg >> 4) & 1}] \
			[expr {($dbg >> 8) & 0x1F}] $i [expr {($ocs >> 24) & 0xF}] [expr {($ocs >> 29) & 1}] \
			[expr {$t1 == $t2 ? "stopped" : "RUNNING"}]]
		incr i
	}
}

# Diagnostic: internal watchdogs and the cause of the last reset (monitor tc37x_wdt_status).
#  - CBS_OSTATE.WDTSUS (bit 7): 0 = all watchdogs suspended while OCDS is enabled (reset default),
#    1 = a CPU watchdog is only suspended while that CPU's SUSOUT (DBGSR.SUSP) is asserted.
#  - SCU_WDTxSR: TIM [31:16] counts while the watchdog runs; DS (bit 3) disabled, OE (bit 1)
#    overflow error, AE (bit 0) access error.
#  - SCU_RSTSTAT: trigger of the last reset. A CPU/safety watchdog timeout ends as an SMU reset,
#    an external SBC watchdog as ESR0/ESR1 or PORST.
proc tc37x_wdt_status {} {
	global tc37x_cores tc37x_dbgsr
	set ostate [lindex [read_memory 0xF0000480 32 1] 0]
	set wdtsus [expr {($ostate >> 7) & 1}]
	echo [format "OSTATE=0x%08x OEN=%d WDTSUS=%d: %s" $ostate [expr {$ostate & 1}] $wdtsus \
		[expr {$wdtsus ? "a watchdog is only suspended while its CPU's SUSOUT is asserted" : "all watchdogs suspended while OCDS is enabled"}]]
	set i 0
	foreach {name addr} {WDTCPU0 0xF0036254 WDTCPU1 0xF0036260 WDTCPU2 0xF003626C WDTS 0xF00362B0} {
		set sr1 [lindex [read_memory $addr 32 1] 0]
		sleep 100
		set sr2 [lindex [read_memory $addr 32 1] 0]
		set susout ""
		if {$i < [llength $tc37x_cores]} {
			set dbg [lindex [read_memory $tc37x_dbgsr([lindex $tc37x_cores $i]) 32 1] 0]
			set susout [format "  SUSOUT=%d" [expr {($dbg >> 4) & 1}]]
		}
		echo [format "%-7s SR=0x%08x TIM=0x%04x %-8s DS=%d OE=%d AE=%d%s" $name $sr2 [expr {($sr2 >> 16) & 0xFFFF}] \
			[expr {(($sr1 ^ $sr2) >> 16) & 0xFFFF ? "COUNTING" : "stopped"}] \
			[expr {($sr2 >> 3) & 1}] [expr {($sr2 >> 1) & 1}] [expr {$sr2 & 1}] $susout]
		incr i
	}
	set rst [lindex [read_memory 0xF0036050 32 1] 0]
	set causes {}
	foreach {bit name} {0 ESR0 1 ESR1 3 SMU 4 SW 5 STM0 6 STM1 7 STM2 16 PORST 18 CB0 19 CB1 20 CB3 23 EVRC 24 EVR33 25 SWD 28 STBYR} {
		if {($rst >> $bit) & 1} { lappend causes $name }
	}
	echo [format "RSTSTAT=0x%08x last reset: %s" $rst [expr {[llength $causes] ? [join $causes ", "] : "-"}]]
}
