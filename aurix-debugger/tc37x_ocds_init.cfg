# TC377 TriBoard with an application on it: board and application settings on top of the
# generic TC3xx OCDS setup in tc3xx_ocds.cfg (multi-core break, STM suspend, HSM and MCS targets).
# Load after the board cfg: -f board/infineon/kit_a2g_tc375_lite.cfg -f tc37x_ocds_init.cfg
#
# The TC375 Lite board cfg is deliberate: it loads target/infineon/tc37x.cfg, whose JTAG ID
# (0x10207083) is the one this TC377 reports. OpenOCD's kit_a2g_tc377tx_3v3_trb.cfg loads
# tc37x_EXT.cfg (0x10208083), which aurix-dbg refuses on this chip over TAS. Otherwise the two
# board cfgs are the same.
#
# For another board or derivative, copy this file, change the chip name passed to tc3xx_ocds_setup
# (CHIPNAME of the target cfg) and the settings below.

# DAP clock: the board cfg sets 5 MHz. The miniWiggler V3 supports up to 30 MHz; on the TC377 board
# 30 MHz read and programmed without a single mismatch (5 x 5.9 MB compared, 3 program/verify
# cycles) and reads 1.9 MB in 1.1 s instead of 4.3 s. Lower it if connections get unreliable
# (longer cable, other board).
adapter speed 30000

# DFLASH0 (NVM/Fee data; 256 KB on the TC377, erase commands beyond it fail with SQER) and DFLASH1
# (HSM data), for erasing them: "flash erase_sector dfls0 0 last" after "reset init".
# The target cfg only defines the PFLASH banks.
flash bank dfls0 tc3x_eflash 0xAF000000 0x40000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 tc37x.cpu0

# The application runs MCS0 and MCS1 (aurix-dbg only). Set tc3xx_mcs_modules {} in a cfg before
# this one to leave them out, tc3xx_hsm_target 0 to leave out the HSM.
if {![info exists tc3xx_mcs_modules]} {
	set tc3xx_mcs_modules {0 1}
}

# STM0/1 suspend: the application's peripheral check restricts
# STM0_ACCEN0 to CPU0 and STM1_ACCEN0 to CPU1, so after "reset run" the debugger's STM0/1_OCS writes
# are refused; connect with tc3xx_connect_reset_halt to get them. STM2 is not restricted.
#
# HSM: the bootloader waits for the HSM (PROCONHSMCFG.SSWWAIT, HSM2HTS), so after a halting reset
# the HSM is started before cpu0 runs (tc3xx_hsm_autostart, like a winIDEA
# InitSeq_HsmAutoStart.ini). Without it cpu1 is never started.
#
# The SBC watchdog resets the board when the cores are halted for too long, hence the retries of
# tc3xx_connect_reset_halt.
#
# Connect sequence (tc3xx_connect_reset_halt): a running reset, the application runs 200 ms and
# configures the SBC watchdog so a halted board is no longer reset, then a halting reset whose hooks
# write STMx_OCS and the trigger setup before the application can lock them (STMx_ACCEN0).
if {![info exists tc3xx_connect_prerun_ms]} {
	set tc3xx_connect_prerun_ms 200
}

# Peripheral suspend, as winIDEA's SuspendPeripheralsWhileStopped: when the peripherals ran on during a
# halt, the application's ADC driver reported a safety error after the resume (from the EVADC
# interrupt on cpu1), and its reset handler reset the board: "polling failed" after a step. With only the EVADC suspended source
# steps still reset the board now and then. The list holds every module of the TC37x SVD whose OCS
# write the running application accepts (the others are off or locked: ASCLIN, QSPI0/1/3, MSC, CCU6,
# SENT, PSI5, ERAY, EDSADC, HSSL, HSCT); SUS=2 is soft suspend, GPT12 has hard suspend (1) only. The
# STMs are set by the halting reset (the application locks them later).
# The application enables the modules after the resume from a reset (the EVADC after 34 ms):
# resume-end keeps trying for tc3xx_suspend_wait_ms.
if {![info exists tc3xx_suspend_ocs]} {
	set tc3xx_suspend_ocs {
		0xF0020028
		0xF019FD38
		0xF02080E8
		0xF02180E8
		0xF0025028
		0xF0036FE8
		{0xF00018E8 1}
		0xF0001EE8
		0xF00020E8
	}
}
if {![info exists tc3xx_suspend_wait_ms]} {
	set tc3xx_suspend_wait_ms 500
}

script [file join [file dirname [info script]] tc3xx_ocds.cfg]
tc3xx_ocds_setup tc37x

# Uncomment to halt all cores at MCS breakpoints:
# foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
