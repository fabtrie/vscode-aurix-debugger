# Generic TC3xx part of an aurix-dbg board cfg, the same for every TC3xx board. Finds the chip by the
# target names, creates the optional HSM/MCS/SCR targets and the DFLASH banks, turns on TL1 sync.
#
# Load it after the target cfg and after the settings below, then add the board's suspend list:
#   script [file join [file dirname [info script]] tc3xx_ocds.cfg]
#   suspend add cores
# Examples: tc375_lite_example.cfg, tc37x_fs26_example.cfg.
#
# Settings (set before this file; * = may also be set after it, before init):
#   tc3xx_sbc            safety-SBC policy: loads <name>_sbc.cfg, e.g. fs26; "" = none     default ""
#   tc3xx_hsm_target *   1: create <chip>.hsm to debug the HSM, halted and resumed with the
#                        cores (TL1). Not needed for the HSM release after a reset         default 0
#   tc3xx_mcs_modules *  GTM MCS modules to create <chip>.mcs<m>.ch0..ch7 for, e.g. {0 1} default {}
#   tc3xx_mcs_ramsize    MCS RAM bytes per module                      default 12 KB (TC37x size)
#   tc3xx_scr_target *   1: create <chip>.scr, the standby controller (adapter bluebox or
#                        tas_client). The SCR must run in OCDS SoC DAP boot mode (PMSWCR4.SCRCFG
#                        = 0x0A): started by the application or by tc3xx_scr_enable. On a
#                        BlueBox it selects debug mode DAP Standard                         default 0
#   tc3xx_dflash         1: flash banks dfls0 (DFLASH0, NVM data), dfls1 (DFLASH1, HSM data) default 1
#   tc3xx_dflash0_size   DFLASH0 size in bytes; known for tc37x, other chips: set it or dfls0 is left out
#
# Server commands (help <command>):
#   ocds sync tl1|none                       all cores halt, resume and step together; tl1 set here
#   ocds step all|single, ocds step_timers run|frozen
#   suspend add <module>|cores [soft|hard|off]   peripherals stopped while the cores are halted, by
#                                            SVD name; nothing suspended unless listed
#   attach_mode passive|hot|halt|reset_halt|reset_run   before init; default hot
#   hsm autostart on|off                     release the HSM after a halting reset; default on
#   reset_hook, halt_check_hook              used by the SBC policy
# The server sets up OCDS, the TL1 routing and the suspend list again after every reset.
#
# Procs (Tcl console, or monitor <proc> in the debug console):
#   tc3xx_status         TL1, per-core DBGSR, OCS of each suspended module
#   tc3xx_wdt_status     watchdogs and the cause of the last reset
#   tc3xx_scr_enable     start the SCR in OCDS SoC DAP boot mode (until the next reset)
#   tc3xx_tl1_force      halt all TL1 members in the same cycle
#   tc3xx_mcs_halt_all   halted handler for MCS channels: an MCS breakpoint halts all cores
#
# winidea backend: winIDEA owns OCDS; TL1, suspend, HSM, MCS and SCR are left to it.
#
# All logic lives in procs: event bodies are not guaranteed to run at global level.

# Sets global $name to $value unless it is set already.
proc tc3xx_default {name value} {
	global $name
	if {![info exists $name]} {
		set $name $value
	}
}
tc3xx_default tc3xx_hsm_target     0
tc3xx_default tc3xx_mcs_modules    {}
tc3xx_default tc3xx_scr_target     0
tc3xx_default tc3xx_sbc            ""
tc3xx_default tc3xx_dflash         1
# Directory of this file and the SBC policy files.
set tc3xx_dir [file dirname [info script]]

set tc3xx_reg(CBS_TLS)      0xF0000470
set tc3xx_reg(OEC)          0xF0000478
set tc3xx_reg(OSTATE)       0xF0000480
set tc3xx_reg(CBS_TLC)      0xF0000490
set tc3xx_reg(CBS_TL1ST)    0xF0000494
set tc3xx_reg(CBS_TLCHE)    0xF0000498
set tc3xx_reg(RSTSTAT)      0xF0036050
set tc3xx_reg(WDTS_SR)      0xF00362B0
set tc3xx_reg(WDTS_CON0)    0xF00362A8
set tc3xx_reg(PMSWCR4)      0xF02480C4
set tc3xx_reg(PMSWSTAT)     0xF02480D4
set tc3xx_reg(PMSWSTATCLR)  0xF02480E8

proc tc3xx_cbs_trc {coreid} { expr {0xF0000420 + 4 * $coreid} }
proc tc3xx_wdtcpu_sr {coreid} { expr {0xF0036254 + 0xC * $coreid} }

# DFLASH0 size by chip name.
set tc3xx_dflash0_sizes {tc37x 0x40000}

# --- Access helpers ----------------------------------------------------------------------------------

# 0 on the winidea backend: winIDEA owns OCDS and refuses the server's debug-register writes.
proc tc3xx_ocds_available {} {
	expr {[adapter name] ne "winidea"}
}

proc tc3xx_rd {addr} {
	lindex [read_memory $addr 32 1] 0
}

proc tc3xx_cpu0 {} {
	lindex $::tc3xx_cores 0
}

# --- Setup -------------------------------------------------------------------------------------------

# Chip name: the prefix of the first TriCore target (tc37x.cpu0 -> tc37x).
proc tc3xx_find_chip {} {
	foreach t [target names] {
		if {[$t cget -type] eq "tricore"} {
			return [lindex [split $t .] 0]
		}
	}
	return -code error "tc3xx_ocds.cfg: no TriCore target (load the target cfg first)"
}

# Runs when this file is loaded; only the first call takes effect.
proc tc3xx_setup {chip} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_hsm tc3xx_mcs_targets tc3xx_chip tc3xx_scr
	global tc3xx_sbc

	if {[info exists tc3xx_chip]} {
		return
	}
	set cores {}
	foreach t [target names] {
		if {[string match "$chip.*" $t] && [$t cget -type] eq "tricore"} {
			lappend cores $t
			set tc3xx_coreid($t) [expr {[$t cget -coreid]}]
			set tc3xx_dbgsr($t) [format 0x%08X [expr {[$t cget -dbgbase] + 0x1FD00}]]
		}
	}
	if {![llength $cores]} {
		return -code error "tc3xx_setup: no tricore targets named $chip.* (load the target cfg first)"
	}
	set tc3xx_chip $chip
	set tc3xx_cores $cores
	set cpu0 [lindex $tc3xx_cores 0]

	set tc3xx_hsm ""
	set tc3xx_mcs_targets {}
	set tc3xx_scr ""
	tc3xx_init_targets
	# Settings made after this file, before init, take effect in init_targets.
	proc init_targets {} { tc3xx_init_targets }
	targets $cpu0
	tc3xx_dflash_banks

	if {![tc3xx_ocds_available]} {
		echo "Note: [adapter name] backend - TL1 break/step, suspend and the HSM are left to winIDEA."
	} else {
		ocds sync tl1
		foreach t $tc3xx_cores {
			$t tricore irq_mask step step_over step_out
		}
	}

	if {$tc3xx_sbc ne ""} {
		script [file join $::tc3xx_dir ${tc3xx_sbc}_sbc.cfg]
		${tc3xx_sbc}_setup
	}
}

# Banks dfls0 (DFLASH0, NVM data) and dfls1 (DFLASH1, HSM data); the target cfg has only PFLASH.
# Erase: "reset init", then "flash erase_sector dfls0 0 last".
proc tc3xx_dflash_banks {} {
	global tc3xx_dflash tc3xx_dflash0_size tc3xx_dflash0_sizes tc3xx_chip
	if {!$tc3xx_dflash} {
		return
	}
	set cpu0 [tc3xx_cpu0]
	if {![info exists tc3xx_dflash0_size] && [dict exists $tc3xx_dflash0_sizes $tc3xx_chip]} {
		set tc3xx_dflash0_size [dict get $tc3xx_dflash0_sizes $tc3xx_chip]
	}
	if {[info exists tc3xx_dflash0_size]} {
		flash bank dfls0 tc3x_eflash 0xAF000000 $tc3xx_dflash0_size 0 0 $cpu0
	} else {
		echo "Note: DFLASH0 size of $tc3xx_chip not known: no dfls0 bank (set tc3xx_dflash0_size)"
	}
	flash bank dfls1 tc3x_eflash 0xAFC00000 0x20000 0 0 $cpu0
}

# --- Run control from scripts ------------------------------------------------------------------------

# Pulses TL1 once: all TL1 members halt in the same cycle. Warns on failure.
proc tc3xx_tl1_force {} {
	if {[catch {ocds tl1_force} err]} {
		echo "Warning: TL1 force failed: $err"
	}
}

# Halted handler for MCS channels (they stop only themselves): a breakpoint or step of a channel
# halts all cores. A TriCore resume does not restart MCS channels. Install with:
#   foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
proc tc3xx_mcs_halt_all {self} {
	if {[$self debug_reason] in {breakpoint single-step}} {
		tc3xx_tl1_force
	}
}

# --- HSM ---------------------------------------------------------------------------------------------

# Creates <chip>.hsm (tc3xx_hsm_target 1). Its debug access works only while the HSM firmware
# enables HSM debugging.
proc tc3xx_hsm_create {} {
	global tc3xx_hsm tc3xx_hsm_target tc3xx_chip
	if {$tc3xx_hsm ne "" || !$tc3xx_hsm_target || ![tc3xx_ocds_available]} {
		return
	}
	set current [target current]
	set tc3xx_hsm $tc3xx_chip.hsm
	target create $tc3xx_hsm cortex_m -coreid 6 -ocmts [[tc3xx_cpu0] cget -ocmts]
	$tc3xx_hsm cortex_m irq_mask step step_over step_out
	targets $current
}

# --- MCS ---------------------------------------------------------------------------------------------

# Creates <chip>.mcs<m>.ch0..ch7 for each module in tc3xx_mcs_modules.
proc tc3xx_mcs_create {} {
	global tc3xx_mcs_modules tc3xx_mcs_ramsize tc3xx_mcs_targets tc3xx_chip
	if {![tc3xx_ocds_available]} {
		return
	}
	set ramsize {}
	if {[info exists tc3xx_mcs_ramsize]} {
		set ramsize [list -ramsize $tc3xx_mcs_ramsize]
	}
	set current [target current]
	foreach m $tc3xx_mcs_modules {
		if {"$tc3xx_chip.mcs$m.ch0" in [target names]} {
			continue
		}
		for {set x 0} {$x < 8} {incr x} {
			set t $tc3xx_chip.mcs$m.ch$x
			target create $t gtm_mcs -module $m -channel $x -coreid [expr {0x40 + 8 * $m + $x}] {*}$ramsize
			lappend tc3xx_mcs_targets $t
		}
	}
	targets $current
}

# --- SCR ---------------------------------------------------------------------------------------------

# Creates <chip>.scr (tc3xx_scr_target 1). The SCR is not on TL1: it halts and resumes on its own.
proc tc3xx_scr_create {} {
	global tc3xx_scr tc3xx_scr_target tc3xx_chip
	if {$tc3xx_scr ne "" || !$tc3xx_scr_target || ![tc3xx_ocds_available]} {
		return
	}
	set current [target current]
	set tc3xx_scr $tc3xx_chip.scr
	target create $tc3xx_scr xc800 -coreid 7
	targets $current
	# The SCR answers only in debug mode DAP Standard (10 MHz or less); set before the connect.
	if {[adapter name] eq "bluebox"} {
		bluebox debug_mode standard
	}
}

# init_targets: creates the optional targets before the probe connects.
proc tc3xx_init_targets {} {
	tc3xx_hsm_create
	tc3xx_mcs_create
	tc3xx_scr_create
}

# --- Diagnostics -------------------------------------------------------------------------------------

# monitor tc3xx_status: TL1, per-core DBGSR, and per suspended module its server state and OCS
# (SUS, SUSSTA = suspended now).
proc tc3xx_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_reg
	echo [format "CBS: TLS.TL1=%d  TLC=0x%08x  TL1ST=0x%08x  TLCHE=0x%08x  OSTATE=0x%08x" \
		[expr {([tc3xx_rd $tc3xx_reg(CBS_TLS)] >> 1) & 1}] [tc3xx_rd $tc3xx_reg(CBS_TLC)] \
		[tc3xx_rd $tc3xx_reg(CBS_TL1ST)] [tc3xx_rd $tc3xx_reg(CBS_TLCHE)] [tc3xx_rd $tc3xx_reg(OSTATE)]]
	foreach t $tc3xx_cores {
		set dbg [tc3xx_rd $tc3xx_dbgsr($t)]
		echo [format "%s DBGSR=0x%08x (HALT=%d SIH=%d SUSP=%d)" $t $dbg \
			[expr {($dbg >> 1) & 3}] [expr {($dbg >> 3) & 1}] [expr {($dbg >> 4) & 1}]]
	}
	foreach m [suspend status] {
		set name [dict get $m name]
		if {[catch {tc3xx_rd [dict get $m ocs]} v]} {
			echo [format "%-9s %-4s %-8s OCS unreadable" $name [dict get $m mode] [dict get $m state]]
			continue
		}
		echo [format "%-9s %-4s %-8s OCS=0x%08x SUS=%d SUSSTA=%d" $name [dict get $m mode] [dict get $m state] $v \
			[expr {($v >> 24) & 0xF}] [expr {($v >> 29) & 1}]]
	}
}

# Runs the (address value) writes with the safety ENDINIT cleared (TC3xx UM 9.4.3). Works while the
# safety watchdog has its reset-default password, e.g. after a reset.
proc tc3xx_safety_endinit_writes {writes} {
	global tc3xx_reg
	set con0 [tc3xx_rd $tc3xx_reg(WDTS_CON0)]
	set pw [expr {($con0 & 0xFFFFFFFC) ^ 0xFC}]
	mww $tc3xx_reg(WDTS_CON0) [expr {$pw | 1}]
	mww $tc3xx_reg(WDTS_CON0) [expr {$pw | 2}]
	set err ""
	foreach {addr val} $writes {
		if {[catch {mww $addr $val} e]} {
			set err $e
			break
		}
	}
	mww $tc3xx_reg(WDTS_CON0) [expr {$pw | 1}]
	mww $tc3xx_reg(WDTS_CON0) [expr {$pw | 3}]
	if {$err ne ""} {
		error $err
	}
}

# monitor tc3xx_scr_enable: starts the SCR in OCDS SoC DAP boot mode (PMSWCR4 SCREN=1, SCRCFG=0x0A,
# SCRSTREQ) and clears the wake-up status. For applications that leave the SCR off; lost with the
# next reset. Returns PMSWSTAT (bit 16: SCR running).
proc tc3xx_scr_enable {} {
	global tc3xx_reg
	tc3xx_safety_endinit_writes [list $tc3xx_reg(PMSWCR4) 0x030A0023 $tc3xx_reg(PMSWSTATCLR) 0xFFFFFFFF]
	format 0x%08x [tc3xx_rd $tc3xx_reg(PMSWSTAT)]
}

# monitor tc3xx_wdt_status: watchdogs and the cause of the last reset. OSTATE.WDTSUS=0: all watchdogs
# suspended while OCDS is on; 1: a CPU watchdog only while its CPU's SUSOUT is set.
proc tc3xx_wdt_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_reg
	set ostate [tc3xx_rd $tc3xx_reg(OSTATE)]
	echo [format "OSTATE=0x%08x OEN=%d WDTSUS=%d" $ostate [expr {$ostate & 1}] [expr {($ostate >> 7) & 1}]]
	set wdts {}
	foreach t $tc3xx_cores {
		lappend wdts WDTCPU$tc3xx_coreid($t) [tc3xx_wdtcpu_sr $tc3xx_coreid($t)] $t
	}
	lappend wdts WDTS $tc3xx_reg(WDTS_SR) ""
	foreach {name addr t} $wdts {
		set sr1 [tc3xx_rd $addr]
		sleep 100
		set sr2 [tc3xx_rd $addr]
		set susout ""
		if {$t ne ""} {
			set susout [format "  SUSOUT=%d" [expr {([tc3xx_rd $tc3xx_dbgsr($t)] >> 4) & 1}]]
		}
		echo [format "%-7s SR=0x%08x TIM=0x%04x %-8s DS=%d OE=%d AE=%d%s" $name $sr2 [expr {($sr2 >> 16) & 0xFFFF}] \
			[expr {(($sr1 ^ $sr2) >> 16) & 0xFFFF ? "COUNTING" : "stopped"}] \
			[expr {($sr2 >> 3) & 1}] [expr {($sr2 >> 1) & 1}] [expr {$sr2 & 1}] $susout]
	}
	set rst [tc3xx_rd $tc3xx_reg(RSTSTAT)]
	set causes {}
	foreach {bit name} {0 ESR0 1 ESR1 3 SMU 4 SW 5 STM0 6 STM1 7 STM2 16 PORST 18 CB0 19 CB1 20 CB3 23 EVRC 24 EVR33 25 SWD 28 STBYR} {
		if {($rst >> $bit) & 1} { lappend causes $name }
	}
	echo [format "RSTSTAT=0x%08x last reset: %s" $rst [expr {[llength $causes] ? [join $causes ", "] : "-"}]]
}

tc3xx_setup [tc3xx_find_chip]
