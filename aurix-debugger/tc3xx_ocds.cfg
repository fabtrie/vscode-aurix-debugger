# Generic OCDS multi-core setup for AURIX TC3xx (OpenOCD and aurix-dbg).
#
# Load after the target cfg and call tc3xx_ocds_setup with its CHIPNAME:
#   script [file join [file dirname [info script]] tc3xx_ocds.cfg]
#   tc3xx_ocds_setup tc37x_ext
#
# The cores come from the target cfg: DBGSR = -dbgbase + 0x1FD00; CBS_TRCx, STMx and WDTCPUx are
# indexed by -coreid.
#
# Options, set before tc3xx_ocds_setup:
#   tc3xx_hsm_target    create <chip>.hsm (aurix-dbg only), default 1
#   tc3xx_mcs_modules   MCS modules whose channels become <chip>.mcs<m>.ch<x> (aurix-dbg only), default {}
#   tc3xx_mcs_ramsize   MCS RAM bytes per module, if not aurix-dbg's default (12 KB, TC37x)
#   tc3xx_hsm_autostart start the HSM after a halting reset, default 1
#   tc3xx_hsm_ready_ms  wait for HSM2HTS ready, default 2000
#   tc3xx_gtm_suspend   suspend the GTM (GTM_OCS.SUS=2) while TL1 holds the cores, default 0
#   tc3xx_step_timers   run|frozen, see tc3xx_step_timers, default run
#   tc3xx_reset_settle_ms  a halting reset must hold this long, else it is repeated (SBC reset loop,
#                       see tc3xx_on_reset_deassert_post), default 500; 0 turns the check off
#   tc3xx_reset_tries   halting resets before giving up, default 20
#
# Multi-core break on the MCU through trigger line TL1: every BRKOUT (CPUs, HSM) drives TL1,
# capture-and-hold keeps it active, and TL1 suspends all CPUs, the HSM and their STMs (OCS.SUS=2) in
# the same cycle. A pause pulses TL1 itself ("tricore tl1_halt on"). Continue releases the other
# cores' debug halt at resume-start and drops the TL1 hold at resume-end, so all cores start
# together. With "tricore tl1_step on" (aurix-dbg) a step runs all cores for one instruction.
#
# All logic lives in procs: event bodies are not guaranteed to run at global level.

proc tc3xx_default {name value} {
	global $name
	if {![info exists $name]} {
		set $name $value
	}
}
tc3xx_default tc3xx_hsm_target    1
tc3xx_default tc3xx_mcs_modules   {}
tc3xx_default tc3xx_hsm_autostart 1
tc3xx_default tc3xx_hsm_ready_ms  2000
tc3xx_default tc3xx_gtm_suspend   0
tc3xx_default tc3xx_step_timers   run
tc3xx_default tc3xx_reset_settle_ms 500
tc3xx_default tc3xx_reset_tries   20

set tc3xx_reg(CBS_TLS)      0xF0000470
set tc3xx_reg(OSTATE)       0xF0000480
set tc3xx_reg(CBS_TLC)      0xF0000490
set tc3xx_reg(CBS_TL1ST)    0xF0000494
set tc3xx_reg(CBS_TLCHE)    0xF0000498
set tc3xx_reg(CBS_TLCHS)    0xF000049C
set tc3xx_reg(CBS_TRHSM)    0xF0000438
set tc3xx_reg(GTM_OCS)      0xF019FD38
set tc3xx_reg(RSTSTAT)      0xF0036050
set tc3xx_reg(WDTS_SR)      0xF00362B0
# HSM bridge: DBGBASE maps the HSM debug area 0xE000xxxx to the window at 0xF005xxxx.
set tc3xx_reg(HSM2HTS)      0xF0040034
set tc3xx_reg(HSM_DBGBASE)  0xF0041010
set tc3xx_reg(HSM_FP_COMP0) 0xF0052008
set tc3xx_reg(HSM_DFSR)     0xF005ED30
set tc3xx_reg(HSM_DHCSR)    0xF005EDF0

proc tc3xx_cbs_trc {coreid} { expr {0xF0000420 + 4 * $coreid} }
proc tc3xx_stm_base {coreid} { expr {0xF0001000 + 0x100 * $coreid} }
proc tc3xx_wdtcpu_sr {coreid} { expr {0xF0036254 + 0xC * $coreid} }

proc tc3xx_is_aurix_dbg {} {
	string match "aurix-dbg*" [version]
}

# Whether this backend lets us drive the OCDS debug registers ourselves.
#
# The winidea backend talks to an iSYSTEM BlueBox through winIDEA, which owns
# OCDS itself: DBGSR, the trigger registers and the CBS trigger lines are not
# ours to write, and the adapter refuses such writes rather than let two
# masters steer the same hardware. Everything else in this file -- creating the
# targets, the HSM release, the read-only diagnostics -- works on either
# backend.
proc tc3xx_ocds_available {} {
	expr {[adapter name] ne "winidea"}
}

proc tc3xx_mww {name addr val} {
	if {[catch {mww $addr $val} err]} {
		echo [format "Warning: %s <- 0x%08x failed: %s" $name $val $err]
	}
}

proc tc3xx_rd {addr} {
	lindex [read_memory $addr 32 1] 0
}

proc tc3xx_ocds_setup {chip} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_hsm tc3xx_mcs_targets
	global tc3xx_hsm_target tc3xx_mcs_modules tc3xx_mcs_ramsize

	set tc3xx_cores {}
	foreach t [target names] {
		if {[string match "$chip.*" $t] && [$t cget -type] eq "tricore"} {
			lappend tc3xx_cores $t
			set tc3xx_coreid($t) [expr {[$t cget -coreid]}]
			set tc3xx_dbgsr($t) [format 0x%08X [expr {[$t cget -dbgbase] + 0x1FD00}]]
		}
	}
	if {![llength $tc3xx_cores]} {
		return -code error "tc3xx_ocds_setup: no tricore targets named $chip.* (load the target cfg first)"
	}
	set cpu0 [lindex $tc3xx_cores 0]

	# The HSM halts and resumes with the TriCore cores through TL1. Its debug window only works while
	# the HSM firmware enables HSM debugging.
	set tc3xx_hsm ""
	set tc3xx_mcs_targets {}
	if {[tc3xx_is_aurix_dbg]} {
		# On a backend that owns OCDS the HSM is that debugger's core, and
		# examining it here enables halting debug on it -- which lets a halt on
		# any TriCore core stop the HSM through TL1 with nothing to resume it.
		if {$tc3xx_hsm_target && [tc3xx_ocds_available]} {
			set tc3xx_hsm $chip.hsm
			target create $tc3xx_hsm cortex_m -coreid 6 -ocmts [$cpu0 cget -ocmts]
		}
		# MCS channels stop only themselves (see tc3xx_mcs_halt_all). Not on a
		# backend that owns OCDS: every channel is polled through memory reads,
		# which cost ~5 ms each over winIDEA.
		set ramsize {}
		if {[info exists tc3xx_mcs_ramsize]} {
			set ramsize [list -ramsize $tc3xx_mcs_ramsize]
		}
		set mcs_modules {}
		if {[tc3xx_ocds_available]} {
			set mcs_modules $tc3xx_mcs_modules
		}
		foreach m $mcs_modules {
			for {set x 0} {$x < 8} {incr x} {
				set t $chip.mcs$m.ch$x
				target create $t gtm_mcs -module $m -channel $x -coreid [expr {0x40 + 8 * $m + $x}] {*}$ramsize
				lappend tc3xx_mcs_targets $t
			}
		}
	}
	targets $cpu0

	if {![tc3xx_ocds_available]} {
		# winIDEA drives run control, so none of the OCDS event handlers below
		# are wired: TL1 multi-core break, STM suspend and the DBGSR handlers
		# would fight it. The HSM is left to winIDEA too, including its start
		# after a halting reset: releasing it from here enables halting debug on
		# it, and a halt on any TriCore core then stops it through TL1.
		echo "Note: [adapter name] backend - TL1 break/step, STM suspend, the HSM and the OCDS event handlers are left to winIDEA; no MCS targets."
		return
	}

	# examine-end fires at init and after every detected reset.
	$cpu0 configure -event examine-end tc3xx_on_examine
	$cpu0 configure -event reset-deassert-post tc3xx_on_reset_deassert_post
	$cpu0 configure -event reset-end tc3xx_on_reset_end

	# irq_mask and tl1_step are aurix-dbg only; turn them off after the setup if not wanted.
	foreach t $tc3xx_cores {
		if {[catch {$t tricore tl1_halt on} err]} {
			echo "Warning: $t: 'tricore tl1_halt' not available - pause will not stop the other cores: $err"
		}
		catch {$t tricore irq_mask step step_over step_out}
		catch {$t tricore tl1_step on}
		$t configure -event halted       "tc3xx_on_halted $t"
		$t configure -event resume-start "tc3xx_on_resume_start $t"
		$t configure -event resume-end   "tc3xx_on_resume_end $t"
		$t configure -event step-start   "tc3xx_on_step_start $t"
	}

	# The HSM steps alone while TL1 holds the TriCore cores: no step-start handler.
	if {$tc3xx_hsm ne ""} {
		$tc3xx_hsm cortex_m tl1_halt on
		$tc3xx_hsm cortex_m irq_mask step step_over step_out
		$tc3xx_hsm configure -event halted       "tc3xx_on_halted $tc3xx_hsm"
		$tc3xx_hsm configure -event resume-start "tc3xx_on_resume_start $tc3xx_hsm"
		$tc3xx_hsm configure -event resume-end   "tc3xx_on_resume_end $tc3xx_hsm"
	}
}

proc tc3xx_others {self} {
	global tc3xx_cores
	set others {}
	foreach t $tc3xx_cores {
		if {$t ne $self} { lappend others $t }
	}
	return $others
}

# DBGSR.SUSP (suspend-out) stops the core's STM while set. Every DBGSR write sets it;
# HALT[2:1]=00 leaves the halt state alone.
proc tc3xx_susout {t on} {
	global tc3xx_dbgsr
	tc3xx_mww "$t DBGSR.SUSP" $tc3xx_dbgsr($t) [expr {$on ? 0x10 : 0}]
}

# STMx suspends with CPUx (OCS.SUS=2). An application may restrict STMx_ACCEN0 after start-up; right
# after a reset the write still lands.
proc tc3xx_stm_ocs_init {} {
	global tc3xx_cores tc3xx_coreid
	foreach t $tc3xx_cores {
		set i $tc3xx_coreid($t)
		set ocs [expr {[tc3xx_stm_base $i] + 0xE8}]
		if {[catch {mww $ocs 0x12000000}]} {
			set a "?"
			catch {set a [format 0x%08x [tc3xx_rd [expr {[tc3xx_stm_base $i] + 0xFC}]]]}
			echo "Warning: STM${i}_OCS write refused (STM${i}_ACCEN0=$a) - suspend applies after the next reset"
		} elseif {([tc3xx_rd $ocs] & 0x0F000000) == 0} {
			echo "Warning: STM${i}_OCS write did not stick"
		} else {
			echo "STM$i suspend (OCS.SUS=2) applied"
		}
	}
}

proc tc3xx_on_examine {} {
	global tc3xx_cores tc3xx_coreid tc3xx_reg tc3xx_gtm_suspend
	# A TL1 force or hold left over from before a warm reset would keep the booting cores suspended.
	tc3xx_mww CBS_TLC   $tc3xx_reg(CBS_TLC)   0
	tc3xx_mww CBS_TLCHS $tc3xx_reg(CBS_TLCHS) 2
	foreach t $tc3xx_cores { tc3xx_susout $t 0 }

	tc3xx_mww CBS_TL1ST $tc3xx_reg(CBS_TL1ST) 0xB000003F ;# CPU0-5, HSSL0, DMA, HSM suspend on TL1
	foreach t $tc3xx_cores {
		set i $tc3xx_coreid($t)
		tc3xx_mww CBS_TRC$i [tc3xx_cbs_trc $i] 0x100 ;# BT1: CPUx BRKOUT -> TL1
	}
	tc3xx_mww CBS_TRHSM $tc3xx_reg(CBS_TRHSM) 0x100    ;# BT1: HSM BRKOUT -> TL1
	tc3xx_mww CBS_TLCHE $tc3xx_reg(CBS_TLCHE) 2        ;# TL1 capture-and-hold

	tc3xx_stm_ocs_init

	# GTM_OCS is only cleared by a debug reset (write 0x10000000 to switch the suspend off).
	if {$tc3xx_gtm_suspend} {
		tc3xx_mww GTM_OCS $tc3xx_reg(GTM_OCS) 0x12000000
	}
}

# STMs while stepping: "run" (SUSP clear) lets them advance with the cores during a TL1-gated step,
# "frozen" (SUSP set while halted) keeps them stopped. At runtime: monitor tc3xx_step_timers frozen
proc tc3xx_step_timers {{mode ""}} {
	global tc3xx_step_timers
	if {$mode ne ""} {
		if {[lsearch -exact {run frozen} $mode] < 0} {
			return -code error "usage: tc3xx_step_timers ?run|frozen?"
		}
		set tc3xx_step_timers $mode
	}
	return $tc3xx_step_timers
}

proc tc3xx_halt_susp {} {
	global tc3xx_step_timers
	expr {$tc3xx_step_timers eq "frozen" ? 0x10 : 0}
}

proc tc3xx_on_halted {self} {
	global tc3xx_cores
	if {[tc3xx_halt_susp]} {
		foreach t $tc3xx_cores { tc3xx_susout $t 1 }
	}
}

# Release the other cores' debug halt (HALT[2:1]=10); the held TL1 keeps them suspended until
# resume-end.
proc tc3xx_on_resume_start {self} {
	global tc3xx_dbgsr tc3xx_hsm
	foreach t [tc3xx_others $self] {
		tc3xx_mww "$t DBGSR" $tc3xx_dbgsr($t) 0x4
	}
	if {$self ne $tc3xx_hsm} {
		tc3xx_hsm_resume
	}
}

# A halted HSM keeps BRKOUT active and would latch TL1 again right after resume-end.
proc tc3xx_hsm_resume {} {
	global tc3xx_hsm tc3xx_reg
	if {$tc3xx_hsm eq ""} {
		return
	}
	if {[catch {
		mww $tc3xx_reg(HSM_DBGBASE) 0xE0000000
		set dhcsr [tc3xx_rd $tc3xx_reg(HSM_DHCSR)]
	}]} {
		return
	}
	if {$dhcsr & 0x00020000} {
		tc3xx_mww "HSM DFSR" $tc3xx_reg(HSM_DFSR) 0x1F
		tc3xx_mww "HSM DHCSR" $tc3xx_reg(HSM_DHCSR) 0xA05F0001 ;# C_DEBUGEN, C_HALT cleared -> run
	}
}

# Drop the TL1 hold: all cores and STMs start in the same cycle.
proc tc3xx_on_resume_end {self} {
	global tc3xx_cores tc3xx_reg
	foreach t $tc3xx_cores { tc3xx_susout $t 0 }
	tc3xx_mww CBS_TLCHS $tc3xx_reg(CBS_TLCHS) 2
}

# tl1_step (aurix-dbg): release the others' debug halt while TL1 still holds them; aurix-dbg releases
# $self and drops the hold, so all cores run for the instruction.
# Otherwise (OpenOCD): debug halt the others (HALT[2:1]=11, SUSP=1) and drop the hold, so only $self
# runs.
proc tc3xx_on_step_start {self} {
	global tc3xx_dbgsr tc3xx_reg
	if {![catch {$self tricore tl1_step} mode] && $mode eq "tl1_step on"} {
		set susp [tc3xx_halt_susp]
		foreach t [tc3xx_others $self] {
			tc3xx_mww "$t DBGSR" $tc3xx_dbgsr($t) [expr {0x4 | $susp}]
		}
		tc3xx_mww "$self DBGSR.SUSP" $tc3xx_dbgsr($self) $susp
	} else {
		foreach t [tc3xx_others $self] {
			tc3xx_mww "$t DBGSR" $tc3xx_dbgsr($t) 0x16
		}
		tc3xx_susout $self 1
		tc3xx_mww CBS_TLCHS $tc3xx_reg(CBS_TLCHS) 2
	}
}

proc tc3xx_tl1_latch {} {
	global tc3xx_reg
	tc3xx_mww CBS_TLC $tc3xx_reg(CBS_TLC) 0x30 ;# force TL1, latched by capture-and-hold
	tc3xx_mww CBS_TLC $tc3xx_reg(CBS_TLC) 0
}

# With a debugger connected the boot ROM sets a breakpoint on the HSM's first instruction, so after a
# halting reset the HSM stays halted, and startup software waiting for it (HSM2HTS) hangs. Delete
# the breakpoint and run the HSM while cpu0 is still halted, after the TL1 latch (the TL1 edge halts
# the HSM).
proc tc3xx_hsm_release {} {
	global tc3xx_reg
	if {[catch {
		mww $tc3xx_reg(HSM_DBGBASE) 0xE0000000
		mww $tc3xx_reg(HSM_FP_COMP0) 0
		mww $tc3xx_reg(HSM_DHCSR) 0xA05F0001
		set dhcsr [tc3xx_rd $tc3xx_reg(HSM_DHCSR)]
	} err]} {
		echo "Warning: HSM not released (HSM debug access: $err)"
		return 0
	}
	if {$dhcsr & 0x00020000} {
		echo [format "Warning: HSM still halted (DHCSR=0x%08x)" $dhcsr]
		return 0
	}
	return 1
}

# Wait for HSM2HTS READY|ACTIVE before cpu0 may run, as the SSW does with PROCONHSMCFG.SSWWAIT.
proc tc3xx_hsm_wait_ready {} {
	global tc3xx_hsm_ready_ms tc3xx_reg
	set v 0
	for {set t 0} {$t <= $tc3xx_hsm_ready_ms} {incr t 20} {
		catch {set v [tc3xx_rd $tc3xx_reg(HSM2HTS)]}
		if {($v & 0x3) == 0x3} {
			return 1
		}
		sleep 20
	}
	echo [format "Warning: HSM not ready after %d ms (HSM2HTS=0x%08x)" $tc3xx_hsm_ready_ms $v]
	return 0
}

# Whether $t stays halted for $ms ms. A failing DBGSR read counts only when it repeats: single
# accesses fail now and then while the HSM runs, during a reset the device is locked for ~30 ms.
proc tc3xx_halt_holds {t ms} {
	global tc3xx_dbgsr
	set t0 [clock milliseconds]
	set errors 0
	while {[clock milliseconds] - $t0 < $ms} {
		if {[catch {tc3xx_rd $tc3xx_dbgsr($t)} dbgsr]} {
			if {[incr errors] >= 3} {
				return 0
			}
		} elseif {($dbgsr & 0x6) != 0x2} {
			return 0
		} else {
			set errors 0
		}
		sleep 10
	}
	return 1
}

# Boards that wire the debugger reset line to the SBC's RSTB: the SBC answers a halting reset with a
# reset loop (up to 12 PORSTs ~75 ms apart, each one drops the halt) until it enters deep fail-safe.
# Halting again after every one of them keeps the software from serving the SBC, so it gets there,
# and the last halting reset holds. On other boards the first reset holds and this only waits
# tc3xx_reset_settle_ms. The background poll is off during a reset; the resets of the loop are not
# reported as detected resets.
proc tc3xx_on_reset_deassert_post {} {
	global tc3xx_cores tc3xx_reset_settle_ms tc3xx_reset_tries
	set cpu0 [lindex $tc3xx_cores 0]
	if {$tc3xx_reset_settle_ms <= 0 || [$cpu0 curstate] ne "halted"} {
		return
	}
	# A reset of the loop may hit the next halting reset: that one fails, the check repeats it.
	set err ""
	for {set i 1} {![tc3xx_halt_holds $cpu0 $tc3xx_reset_settle_ms]} {incr i} {
		if {$i >= $tc3xx_reset_tries} {
			echo "Warning: halting reset lost $i times (SBC reset loop?) - cores not halted after reset $err"
			return
		}
		catch {
			foreach t [target names] { $t arp_reset assert 1 }
			foreach t [target names] { $t arp_reset deassert 1 }
		} err
	}
	if {$i > 1} {
		echo "Halting reset held after $i attempts (SBC reset loop)"
	}
}

# A debugger reset clears the STM OCS without a re-examine: redo the setup. After a halting reset,
# latch TL1 so the boot-halted cores and all STMs stay stopped until continue.
proc tc3xx_on_reset_end {} {
	global tc3xx_cores tc3xx_hsm_autostart tc3xx_reg
	tc3xx_on_examine
	set cpu0 [lindex $tc3xx_cores 0]
	if {[$cpu0 curstate] eq "halted"} {
		tc3xx_tl1_latch
		if {$tc3xx_hsm_autostart && [tc3xx_hsm_release]} {
			tc3xx_hsm_wait_ready
		} else {
			# The halted HSM keeps BRKOUT active: unroute it from TL1.
			tc3xx_mww CBS_TRHSM $tc3xx_reg(CBS_TRHSM) 0
		}
		tc3xx_on_halted $cpu0
	}
}

# Connect with a halting reset (configCommands: ["init", "tc3xx_connect_reset_halt"]). A watchdog
# can reset the chip again right after: retry when cpu0 is not halted a moment later.
proc tc3xx_connect_reset_halt {{tries 3} {delay 200}} {
	global tc3xx_cores tc3xx_dbgsr
	set cpu0 [lindex $tc3xx_cores 0]
	for {set i 1} {$i <= $tries} {incr i} {
		if {[catch {reset halt} err]} {
			echo "Warning: reset halt attempt $i: $err"
		} else {
			sleep 100
			set halted 0
			catch {set halted [expr {[tc3xx_rd $tc3xx_dbgsr($cpu0)] & 0x2}]}
			if {$halted} {
				echo "Connected with reset halt (attempt $i)"
				return
			}
			echo "Warning: reset halt attempt $i: $cpu0 no longer halted (watchdog reset?)"
		}
		sleep $delay
	}
	echo "Warning: reset halt failed $tries times - cores not halted after reset"
}

# Optional halted handler for MCS channels: halt all cores when a channel stops at a breakpoint or
# step. A TriCore continue does not enable MCS channels.
#   foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
proc tc3xx_mcs_halt_all {self} {
	if {[$self debug_reason] in {breakpoint single-step}} {
		tc3xx_tl1_latch
	}
}

# Diagnostic while halted: monitor tc3xx_stm_status
proc tc3xx_stm_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_reg
	echo [format "CBS: TLS.TL1=%d  TLC=0x%08x  TL1ST=0x%08x  TLCHE=0x%08x" \
		[expr {([tc3xx_rd $tc3xx_reg(CBS_TLS)] >> 1) & 1}] [tc3xx_rd $tc3xx_reg(CBS_TLC)] \
		[tc3xx_rd $tc3xx_reg(CBS_TL1ST)] [tc3xx_rd $tc3xx_reg(CBS_TLCHE)]]
	foreach t $tc3xx_cores {
		set i $tc3xx_coreid($t)
		set dbg  [tc3xx_rd $tc3xx_dbgsr($t)]
		set base [tc3xx_stm_base $i]
		set ocs  [tc3xx_rd [expr {$base + 0xE8}]]
		set t1   [tc3xx_rd [expr {$base + 0x10}]]
		sleep 100
		set t2   [tc3xx_rd [expr {$base + 0x10}]]
		echo [format "%s DBGSR=0x%08x (HALT=%d SIH=%d SUSP=%d EVTSRC=0x%02x)  STM%d OCS.SUS=%d SUSSTA=%d  TIM0 %s" \
			$t $dbg [expr {($dbg >> 1) & 3}] [expr {($dbg >> 3) & 1}] [expr {($dbg >> 4) & 1}] \
			[expr {($dbg >> 8) & 0x1F}] $i [expr {($ocs >> 24) & 0xF}] [expr {($ocs >> 29) & 1}] \
			[expr {$t1 == $t2 ? "stopped" : "RUNNING"}]]
	}
}

# Diagnostic: watchdogs and the cause of the last reset (monitor tc3xx_wdt_status).
# OSTATE.WDTSUS=0: all watchdogs suspended while OCDS is enabled; 1: a CPU watchdog only while its
# CPU's SUSOUT is set.
proc tc3xx_wdt_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_reg
	set ostate [tc3xx_rd $tc3xx_reg(OSTATE)]
	echo [format "OSTATE=0x%08x OEN=%d WDTSUS=%d" $ostate [expr {$ostate & 1}] [expr {($ostate >> 7) & 1}]]
	set wdts {}
	foreach t $tc3xx_cores {
		lappend wdts WDTCPU$tc3xx_coreid($t) [tc3xx_wdtcpu_sr $tc3xx_coreid($t)] $t
	}
	lappend wdts WDTS $tc3xx_reg(WDTS_SR) ""
	foreach {name addr t} $wdts {
		set sr1 [tc3xx_rd $addr]
		sleep 100
		set sr2 [tc3xx_rd $addr]
		set susout ""
		if {$t ne ""} {
			set susout [format "  SUSOUT=%d" [expr {([tc3xx_rd $tc3xx_dbgsr($t)] >> 4) & 1}]]
		}
		echo [format "%-7s SR=0x%08x TIM=0x%04x %-8s DS=%d OE=%d AE=%d%s" $name $sr2 [expr {($sr2 >> 16) & 0xFFFF}] \
			[expr {(($sr1 ^ $sr2) >> 16) & 0xFFFF ? "COUNTING" : "stopped"}] \
			[expr {($sr2 >> 3) & 1}] [expr {($sr2 >> 1) & 1}] [expr {$sr2 & 1}] $susout]
	}
	set rst [tc3xx_rd $tc3xx_reg(RSTSTAT)]
	set causes {}
	foreach {bit name} {0 ESR0 1 ESR1 3 SMU 4 SW 5 STM0 6 STM1 7 STM2 16 PORST 18 CB0 19 CB1 20 CB3 23 EVRC 24 EVR33 25 SWD 28 STBYR} {
		if {($rst >> $bit) & 1} { lappend causes $name }
	}
	echo [format "RSTSTAT=0x%08x last reset: %s" $rst [expr {[llength $causes] ? [join $causes ", "] : "-"}]]
}
