# AURIX TC3xx chip mechanics for OpenOCD and aurix-dbg: multi-core break and step through trigger line
# TL1, STM and peripheral suspend, the HSM, reset detection. No board policy: what a reset or an
# attach has to do on a particular board (external watchdog, reset wiring) lives in a policy file
# such as fs26_sbc.cfg, which plugs in through tc3xx_policy.
#
# Load after the target cfg and call tc3xx_setup with its CHIPNAME:
#   script [file join [file dirname [info script]] tc3xx_ocds.cfg]
#   tc3xx_setup tc37x
#
# The cores come from the target cfg: DBGSR = -dbgbase + 0x1FD00; CBS_TRCx and STMx are indexed by
# -coreid.
#
# Settings (set before tc3xx_setup):
#   tc3xx_hsm_target    1: create <chip>.hsm (aurix-dbg only)                               default 1
#   tc3xx_mcs_modules   MCS modules whose channels become <chip>.mcs<m>.ch<x> (aurix-dbg)   default {}
#   tc3xx_mcs_ramsize   MCS RAM bytes per module, if not aurix-dbg's default (TC37x)
#   tc3xx_hsm_autostart 1: release the HSM after a halting reset (the bootloader waits for it)  default 1
#   tc3xx_hsm_ready_ms  wait this long for HSM2HTS READY|ACTIVE after the release          default 2000
#   tc3xx_step_timers   run|frozen: the STMs run during a step or stay stopped             default run
#   tc3xx_periph        peripherals to suspend while the cores are halted, entries
#                       {name ocs clc accen0 sus class} (addresses of the module's OCS, CLC and
#                       ACCEN0 registers). sus: 2 soft, 1 hard suspend. class:
#                         reset  writable right after a reset (module on by default); written by
#                                tc3xx_after_reset, before the application can lock it
#                         app    writable only once the application has enabled the module
#                       The STMs of the cores are added by tc3xx_setup (class reset).    default {}
#   tc3xx_periph_wait_ms  after a reset, the first resume waits this long for the application to
#                       enable the app-class modules                                     default 500
#   tc3xx_policy        command prefix called with an event name: examine, reset-end, halted <t>,
#                       resumed <t>.
#                       Set by a policy file; empty = chip behaviour only               default ""
#
# How the multi-core break works: every BRKOUT (CPUs, HSM) drives TL1, capture-and-hold keeps it
# active, and TL1 suspends all CPUs, the HSM and everything whose OCS.SUS is set, in the same cycle. A
# pause pulses TL1 itself ("tricore tl1_halt on"). Continue releases the other cores' debug halt at
# resume-start and drops the TL1 hold at resume-end, so all cores start together. With "tricore
# tl1_step on" (aurix-dbg) a step runs all cores for one instruction.
#
# All logic lives in procs: event bodies are not guaranteed to run at global level.

proc tc3xx_default {name value} {
	global $name
	if {![info exists $name]} {
		set $name $value
	}
}
tc3xx_default tc3xx_hsm_target     1
tc3xx_default tc3xx_mcs_modules    {}
tc3xx_default tc3xx_hsm_autostart  1
tc3xx_default tc3xx_hsm_ready_ms   2000
tc3xx_default tc3xx_step_timers    run
tc3xx_default tc3xx_periph         {}
tc3xx_default tc3xx_periph_wait_ms 500
tc3xx_default tc3xx_policy         ""
# Set by a policy around its halting resets (halt, or run: resumed right after): reset-end then does
# only the urgent part (OCDS, the reset-class suspend, the HSM release); tc3xx_reset_finish does the
# rest - at resume-end for a reset that runs on, or by the policy once its
# halt is established.
set tc3xx_reset_quick 0
set tc3xx_reset_todo 0

set tc3xx_reg(CBS_TRHSM)    0xF0000438
set tc3xx_reg(CBS_TLS)      0xF0000470
set tc3xx_reg(OEC)          0xF0000478
set tc3xx_reg(OSTATE)       0xF0000480
set tc3xx_reg(CBS_TLC)      0xF0000490
set tc3xx_reg(CBS_TL1ST)    0xF0000494
set tc3xx_reg(CBS_TLCHE)    0xF0000498
set tc3xx_reg(CBS_TLCHS)    0xF000049C
set tc3xx_reg(RSTSTAT)      0xF0036050
set tc3xx_reg(WDTS_SR)      0xF00362B0
# HSM bridge: DBGBASE maps the HSM debug area 0xE000xxxx to the window at 0xF005xxxx.
set tc3xx_reg(HSM2HTS)      0xF0040034
set tc3xx_reg(HSM_DBGBASE)  0xF0041010
set tc3xx_reg(HSM_FP_COMP0) 0xF0052008
set tc3xx_reg(HSM_DFSR)     0xF005ED30
set tc3xx_reg(HSM_DHCSR)    0xF005EDF0

proc tc3xx_cbs_trc {coreid} { expr {0xF0000420 + 4 * $coreid} }
proc tc3xx_stm_base {coreid} { expr {0xF0001000 + 0x100 * $coreid} }
proc tc3xx_wdtcpu_sr {coreid} { expr {0xF0036254 + 0xC * $coreid} }

# --- Access helpers ----------------------------------------------------------------------------------

proc tc3xx_is_aurix_dbg {} {
	string match "aurix-dbg*" [version]
}

# Whether this backend lets us drive the OCDS debug registers ourselves. The winidea backend talks to
# a BlueBox through winIDEA, which owns OCDS (DBGSR, trigger registers, CBS trigger lines) and refuses
# such writes; only the target creation and read-only diagnostics work there.
proc tc3xx_ocds_available {} {
	expr {[adapter name] ne "winidea"}
}

proc tc3xx_rd {addr} {
	lindex [read_memory $addr 32 1] 0
}

# Write that warns on failure.
proc tc3xx_wr {name addr val} {
	if {[catch {mww $addr $val} err]} {
		echo [format "Warning: %s <- 0x%08x failed: %s" $name $val $err]
	}
}

# Write that returns 1/0 and stays quiet.
proc tc3xx_try_wr {addr val} {
	expr {![catch {mww $addr $val}]}
}

proc tc3xx_policy_call {event args} {
	global tc3xx_policy
	if {$tc3xx_policy ne ""} {
		{*}$tc3xx_policy $event {*}$args
	}
}

# --- Setup -------------------------------------------------------------------------------------------

proc tc3xx_setup {chip} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_hsm tc3xx_mcs_targets tc3xx_chip
	global tc3xx_hsm_target tc3xx_mcs_modules tc3xx_mcs_ramsize tc3xx_periph tc3xx_periph_list

	set tc3xx_chip $chip
	set tc3xx_cores {}
	foreach t [target names] {
		if {[string match "$chip.*" $t] && [$t cget -type] eq "tricore"} {
			lappend tc3xx_cores $t
			set tc3xx_coreid($t) [expr {[$t cget -coreid]}]
			set tc3xx_dbgsr($t) [format 0x%08X [expr {[$t cget -dbgbase] + 0x1FD00}]]
		}
	}
	if {![llength $tc3xx_cores]} {
		return -code error "tc3xx_setup: no tricore targets named $chip.* (load the target cfg first)"
	}
	set cpu0 [lindex $tc3xx_cores 0]

	# Peripheral suspend list: each core's STM (class reset), then the board's modules.
	set tc3xx_periph_list {}
	foreach t $tc3xx_cores {
		set i $tc3xx_coreid($t)
		set b [tc3xx_stm_base $i]
		lappend tc3xx_periph_list [list STM$i [expr {$b + 0xE8}] $b [expr {$b + 0xFC}] 2 reset]
	}
	foreach e $tc3xx_periph {
		lassign $e name ocs clc accen sus class
		if {$sus eq ""} { set sus 2 }
		if {$class eq ""} { set class app }
		lappend tc3xx_periph_list [list $name $ocs $clc $accen $sus $class]
	}
	tc3xx_periph_mark_reset

	set tc3xx_hsm ""
	set tc3xx_mcs_targets {}
	if {[tc3xx_is_aurix_dbg] && [tc3xx_ocds_available]} {
		# The HSM halts and resumes with the TriCore cores through TL1 (its debug window only works
		# while the HSM firmware enables HSM debugging).
		if {$tc3xx_hsm_target} {
			set tc3xx_hsm $chip.hsm
			target create $tc3xx_hsm cortex_m -coreid 6 -ocmts [$cpu0 cget -ocmts]
		}
		# MCS channels stop only themselves (see tc3xx_mcs_halt_all).
		set ramsize {}
		if {[info exists tc3xx_mcs_ramsize]} {
			set ramsize [list -ramsize $tc3xx_mcs_ramsize]
		}
		foreach m $tc3xx_mcs_modules {
			for {set x 0} {$x < 8} {incr x} {
				set t $chip.mcs$m.ch$x
				target create $t gtm_mcs -module $m -channel $x -coreid [expr {0x40 + 8 * $m + $x}] {*}$ramsize
				lappend tc3xx_mcs_targets $t
			}
		}
	}
	targets $cpu0

	if {![tc3xx_ocds_available]} {
		echo "Note: [adapter name] backend - TL1 break/step, suspend, the HSM and the OCDS event handlers are left to winIDEA."
		return
	}

	# examine-end fires at init and after every reset the poll detects (FS26, application).
	$cpu0 configure -event examine-end tc3xx_on_examine
	$cpu0 configure -event reset-end   tc3xx_on_reset_end
	foreach t $tc3xx_cores {
		if {[catch {$t tricore tl1_halt on} err]} {
			echo "Warning: $t: 'tricore tl1_halt' not available - pause will not stop the other cores: $err"
		}
		catch {$t tricore irq_mask step step_over step_out}
		catch {$t tricore tl1_step on}
		$t configure -event halted       "tc3xx_on_halted $t"
		$t configure -event resume-start "tc3xx_on_resume_start $t"
		$t configure -event resume-end   "tc3xx_on_resume_end $t"
		$t configure -event step-start   "tc3xx_on_step_start $t"
	}
	# The HSM steps alone while TL1 holds the TriCore cores: no step-start handler.
	if {$tc3xx_hsm ne ""} {
		$tc3xx_hsm cortex_m tl1_halt on
		$tc3xx_hsm cortex_m irq_mask step step_over step_out
		$tc3xx_hsm configure -event halted       "tc3xx_on_halted $tc3xx_hsm"
		$tc3xx_hsm configure -event resume-start "tc3xx_on_resume_start $tc3xx_hsm"
		$tc3xx_hsm configure -event resume-end   "tc3xx_on_resume_end $tc3xx_hsm"
	}
}

proc tc3xx_cpu0 {} {
	lindex $::tc3xx_cores 0
}

proc tc3xx_others {self} {
	global tc3xx_cores
	set others {}
	foreach t $tc3xx_cores {
		if {$t ne $self} { lappend others $t }
	}
	return $others
}

# --- OCDS enable and the setup a reset clears --------------------------------------------------------

# OCDS on (OEC key A1 5E A1 5E) if OSTATE.OEN is 0, as after any power-on class reset (debugger reset,
# FS26 RSTB). Also what the application's debugger check reads (with DBGSR.DE): the application only
# treats the debugger as attached if this ran before its check. Returns 1 if OCDS is on afterwards.
proc tc3xx_ocds_enable {} {
	global tc3xx_reg
	if {[catch {tc3xx_rd $tc3xx_reg(OSTATE)} os]} {
		return 0
	}
	if {$os & 1} {
		return 1
	}
	foreach b {0xA1 0x5E 0xA1 0x5E} {
		catch {mww $tc3xx_reg(OEC) $b}
	}
	expr {![catch {tc3xx_rd $tc3xx_reg(OSTATE)} os] && ($os & 1)}
}

# Multi-core break routing (cleared by a power-on class reset):
#   CBS_TLC=0      drop a TL1 force left over from before a warm reset
#   CBS_TLCHS=2    drop a TL1 hold left over (it would keep the booting cores suspended)
#   CBS_TL1ST      TL1 suspends CPU0-5, HSSL0, DMA, HSM (and every module whose OCS.SUS is set)
#   CBS_TRCx=0x100 CPUx BRKOUT drives TL1;  CBS_TRHSM=0x100 HSM BRKOUT drives TL1
#   CBS_TLCHE=2    TL1 capture-and-hold: one pulse keeps TL1 active until CBS_TLCHS clears it
proc tc3xx_tl1_config {} {
	global tc3xx_cores tc3xx_coreid tc3xx_reg
	tc3xx_wr CBS_TLC   $tc3xx_reg(CBS_TLC)   0
	tc3xx_wr CBS_TLCHS $tc3xx_reg(CBS_TLCHS) 2
	foreach t $tc3xx_cores { tc3xx_susout $t 0 }
	tc3xx_wr CBS_TL1ST $tc3xx_reg(CBS_TL1ST) 0xB000003F
	foreach t $tc3xx_cores {
		set i $tc3xx_coreid($t)
		tc3xx_wr CBS_TRC$i [tc3xx_cbs_trc $i] 0x100
	}
	tc3xx_wr CBS_TRHSM $tc3xx_reg(CBS_TRHSM) 0x100
	tc3xx_wr CBS_TLCHE $tc3xx_reg(CBS_TLCHE) 2
}

# CBS_TLC=0x30 then 0: one TL1 pulse, latched by capture-and-hold: all routed cores stop in the same
# cycle.
proc tc3xx_tl1_force {} {
	global tc3xx_reg
	tc3xx_wr CBS_TLC $tc3xx_reg(CBS_TLC) 0x30
	tc3xx_wr CBS_TLC $tc3xx_reg(CBS_TLC) 0
}

# CBS_TLCHS=2: drop the TL1 hold: all cores and suspended modules start in the same cycle.
proc tc3xx_tl1_release {} {
	global tc3xx_reg
	tc3xx_wr CBS_TLCHS $tc3xx_reg(CBS_TLCHS) 2
}

# DBGSR.SUSP (suspend-out): stops the core's STM while set. HALT[2:1]=00 leaves the halt state alone.
proc tc3xx_susout {t on} {
	global tc3xx_dbgsr
	tc3xx_wr "$t DBGSR.SUSP" $tc3xx_dbgsr($t) [expr {$on ? 0x10 : 0}]
}

# Everything a power-on class reset cleared, in order of urgency: OCDS (the application checks it
# about 25 ms after it starts), the reset-class OCS (STM0/1: locked by the application's ACCEN0 setup
# right after that check), the TL1 routing, the HSM debug enable. Called as soon as the device answers
# after a reset: by tc3xx_reset_watch, the examine after a detected reset and the reset-end hook.
proc tc3xx_after_reset {} {
	tc3xx_ocds_enable
	tc3xx_periph_mark_reset
	tc3xx_periph_suspend reset
	tc3xx_tl1_config
	tc3xx_hsm_debug_enable
}

# --- Peripheral suspend ------------------------------------------------------------------------------

# After a reset every module needs its OCS again (a power-on class reset clears OCS; an application
# reset keeps it, which the read in tc3xx_periph_suspend notices).
proc tc3xx_periph_mark_reset {} {
	global tc3xx_periph_list tc3xx_periph_todo tc3xx_periph_fresh
	foreach e $tc3xx_periph_list {
		set tc3xx_periph_todo([lindex $e 0]) 1
	}
	set tc3xx_periph_fresh 1
}

# Suspend the modules of a class (reset, app or all) that still need it: read OCS, write
# SUS_P|SUS<<24 only if SUS differs, read back.
#
# The write is only tried when it can land: the module is enabled (CLC.DISS=0) and its ACCEN0 lets
# the debugger write (Cerberus, TAG bit 28). A refused write is not harmless: on one application a
# single write to STM0_OCS after its ACCEN0 setup reset the board, and the FS26 followed with a dozen
# more resets. A module that is still disabled stays to do; with wait_ms the check is repeated until
# the application has enabled it. Returns the names still to do.
proc tc3xx_periph_writable {clc accen} {
	expr {![catch {tc3xx_rd $clc} c] && !($c & 0x2) && ![catch {tc3xx_rd $accen} a] && (($a >> 28) & 1)}
}

proc tc3xx_periph_suspend {{class all} {wait_ms 0}} {
	global tc3xx_periph_list tc3xx_periph_todo
	set t0 [clock milliseconds]
	while 1 {
		set left {}
		foreach e $tc3xx_periph_list {
			lassign $e name ocs clc accen sus cls
			if {($class ne "all" && $cls ne $class) || !$tc3xx_periph_todo($name)} {
				continue
			}
			if {![catch {tc3xx_rd $ocs} v] && (($v >> 24) & 0xF) == $sus} {
				set tc3xx_periph_todo($name) 0
				continue
			}
			if {[tc3xx_periph_writable $clc $accen] &&
				[tc3xx_try_wr $ocs [expr {0x10000000 | ($sus << 24)}]] &&
				![catch {tc3xx_rd $ocs} v] && (($v >> 24) & 0xF) == $sus} {
				set tc3xx_periph_todo($name) 0
			} else {
				lappend left $name
			}
		}
		if {![llength $left] || [clock milliseconds] - $t0 >= $wait_ms} {
			return $left
		}
		sleep 5
	}
}

# The reset-class suspend right after a halting reset, with cpu0 at the reset vector: if STM0_ACCEN0
# still holds its reset value the application has not run, so the reset-class modules (on by default)
# take the write; one read instead of the per-module checks (~1.5 ms per access through a BlueBox,
# where the halted phase is short on a board whose SBC resets a core still halted ~256 ms after the
# reset). Otherwise the checked path.
proc tc3xx_periph_suspend_fresh {} {
	global tc3xx_periph_list tc3xx_periph_todo
	set accen [lindex $tc3xx_periph_list 0 3]
	if {[catch {tc3xx_rd $accen} a] || $a != 0xFFFFFFFF} {
		return [tc3xx_periph_suspend reset]
	}
	set left {}
	foreach e $tc3xx_periph_list {
		lassign $e name ocs clc accen sus cls
		if {$cls ne "reset" || !$tc3xx_periph_todo($name)} {
			continue
		}
		if {[tc3xx_try_wr $ocs [expr {0x10000000 | ($sus << 24)}]]} {
			set tc3xx_periph_todo($name) 0
		} else {
			lappend left $name
		}
	}
	return $left
}

# Names of the modules of a class still without their suspend.
proc tc3xx_periph_pending {{class all}} {
	global tc3xx_periph_list tc3xx_periph_todo
	set out {}
	foreach e $tc3xx_periph_list {
		set name [lindex $e 0]
		if {($class eq "all" || [lindex $e 5] eq $class) && $tc3xx_periph_todo($name)} {
			lappend out $name
		}
	}
	return $out
}

# --- HSM ---------------------------------------------------------------------------------------------

# Halting debug on for the running HSM (C_DEBUGEN, not halted). Without it the HSM does not stop with
# the cores, and the peripherals do not suspend either. Only if C_DEBUGEN is off (a power-on reset
# clears it): an HSM halted at the boot ROM's breakpoint has it on, and writing DHCSR without C_HALT
# would release it before tc3xx_hsm_release deleted the breakpoint. Quiet: right after a reset the
# HSM debug access may not be there yet.
proc tc3xx_hsm_debug_enable {} {
	global tc3xx_hsm tc3xx_reg
	if {$tc3xx_hsm eq ""} {
		return
	}
	catch {
		mww $tc3xx_reg(HSM_DBGBASE) 0xE0000000
		if {!([tc3xx_rd $tc3xx_reg(HSM_DHCSR)] & 1)} {
			mww $tc3xx_reg(HSM_DHCSR) 0xA05F0001
		}
	}
}

# With a debugger connected the boot ROM sets a breakpoint on the HSM's first instruction, so after a
# halting reset the HSM stays halted, and the bootloader waiting for it (HSM2HTS) hangs: delete the
# breakpoint (FP_COMP0=0) and run the HSM (DHCSR C_DEBUGEN without C_HALT).
proc tc3xx_hsm_release {} {
	global tc3xx_reg
	if {[catch {
		mww $tc3xx_reg(HSM_DBGBASE) 0xE0000000
		mww $tc3xx_reg(HSM_FP_COMP0) 0
		mww $tc3xx_reg(HSM_DHCSR) 0xA05F0001
		set dhcsr [tc3xx_rd $tc3xx_reg(HSM_DHCSR)]
	} err]} {
		echo "Warning: HSM not released (HSM debug access: $err)"
		return 0
	}
	if {$dhcsr & 0x00020000} {
		echo [format "Warning: HSM still halted (DHCSR=0x%08x)" $dhcsr]
		return 0
	}
	return 1
}

# HSM2HTS READY|ACTIVE: the bootloader may start cpu0's application only then (PROCONHSMCFG.SSWWAIT).
proc tc3xx_hsm_wait_ready {} {
	global tc3xx_hsm_ready_ms tc3xx_reg
	set v 0
	set t0 [clock milliseconds]
	while {[clock milliseconds] - $t0 <= $tc3xx_hsm_ready_ms} {
		catch {set v [tc3xx_rd $tc3xx_reg(HSM2HTS)]}
		if {($v & 0x3) == 0x3} {
			return 1
		}
		sleep 2
	}
	echo [format "Warning: HSM not ready after %d ms (HSM2HTS=0x%08x)" $tc3xx_hsm_ready_ms $v]
	return 0
}

# A halted HSM keeps BRKOUT active and would latch TL1 again right after resume-end.
proc tc3xx_hsm_resume {} {
	global tc3xx_hsm tc3xx_reg
	if {$tc3xx_hsm eq ""} {
		return
	}
	if {[catch {
		mww $tc3xx_reg(HSM_DBGBASE) 0xE0000000
		set dhcsr [tc3xx_rd $tc3xx_reg(HSM_DHCSR)]
	}]} {
		return
	}
	if {$dhcsr & 0x00020000} {
		tc3xx_wr "HSM DFSR" $tc3xx_reg(HSM_DFSR) 0x1F
		tc3xx_wr "HSM DHCSR" $tc3xx_reg(HSM_DHCSR) 0xA05F0001
	}
}

# --- Run control from scripts ------------------------------------------------------------------------

# Halt all cores as the debugger's pause does, with the peripherals suspended first (written at the
# halt, a few ms of a module running were enough for the application's ADC driver to report a safety
# error). Done on the registers as the debugger's pause does it (TL1 forced, then cpu0's DBGSR halt
# request), not with arp_halt: in a handler or after a reset the server's state can be stale (still
# "halted" from before an FS26 reset), and arp_halt would do nothing. The poll picks the halt up.
# Returns 1 when halted.
proc tc3xx_halt_all {{timeout_ms 1000}} {
	global tc3xx_dbgsr
	set cpu0 [tc3xx_cpu0]
	tc3xx_periph_suspend all
	set halted 0
	catch {
		tc3xx_tl1_force
		mww $tc3xx_dbgsr($cpu0) 0x6
		set t0 [clock milliseconds]
		while {!$halted && [clock milliseconds] - $t0 < $timeout_ms} {
			set halted [expr {([tc3xx_rd $tc3xx_dbgsr($cpu0)] & 0x6) == 0x2}]
			if {!$halted} {
				sleep 5
			}
		}
	}
	if {!$halted} {
		echo "Warning: cores not halted"
		return 0
	}
	# Let the server see the halt now: the background poll does not run during startup commands or
	# handlers, and a resume on a target it still thinks running does nothing.
	foreach t [concat $::tc3xx_cores $::tc3xx_hsm] {
		if {$t ne "" && [$t was_examined]} {
			catch {$t arp_poll}
		}
	}
	return 1
}

# Resume all cores the way continue does (the resume-start/-end handlers release the others and TL1).
proc tc3xx_resume_all {} {
	set cpu0 [tc3xx_cpu0]
	if {[catch {$cpu0 arp_resume} err]} {
		echo "Warning: resume failed: $err"
		return 0
	}
	return 1
}

# Whether $t stays halted for $ms ms: true only once a read after $ms ms still shows it halted. A
# failing DBGSR read counts only when it repeats (single accesses fail now and then while the HSM
# runs); a probe that reconnects on a failed read (BlueBox ~0.6 s) can spend the whole window in one
# failed read, which is a lost halt, not a held one.
proc tc3xx_halt_holds {t ms} {
	global tc3xx_dbgsr
	set t0 [clock milliseconds]
	set errors 0
	while 1 {
		set failed [catch {tc3xx_rd $tc3xx_dbgsr($t)} dbgsr]
		set late [expr {[clock milliseconds] - $t0 >= $ms}]
		if {$failed} {
			if {[incr errors] >= 3 || $late} {
				return 0
			}
		} elseif {($dbgsr & 0x6) != 0x2} {
			return 0
		} elseif {$late} {
			return 1
		} else {
			set errors 0
		}
		sleep 5
	}
}

# --- Reset detection ---------------------------------------------------------------------------------

# STM0 as one 64-bit value (reading TIM0 latches bits 63:32 into CAP), "" if it cannot be read. TIM0
# alone wraps every ~43 s at 100 MHz, and a wrap looks like a reset.
proc tc3xx_stm64 {} {
	if {[catch {
		set lo [tc3xx_rd 0xF0001010]
		set hi [tc3xx_rd 0xF000102C]
	}]} {
		return ""
	}
	expr {($hi << 32) | $lo}
}

# Watches for resets for up to max_ms, polling STM0 every 2 ms. A reset is a read that fails (power-on
# class reset: the probe reconnects) or STM0 counting from a lower value. As soon as the device answers
# after a reset, tc3xx_after_reset restores OCDS and the reset-class OCS: early enough for the
# application to see the debugger and before it locks STM0/1. Ends early once no reset came for
# quiet_ms and the optional condition (a command, evaluated at global level) is true.
# Returns a dict: settled 0/1, resets, elapsed (ms), down (ms the target was unreachable at the end).
proc tc3xx_reset_watch {max_ms quiet_ms {until ""}} {
	set t0 [clock milliseconds]
	set calm $t0
	set prev ""
	set n 0
	set down_since -1
	set fails 0
	while 1 {
		set now [clock milliseconds]
		set s [tc3xx_stm64]
		if {$s eq ""} {
			# A single failed read is noise (seen through a miniWiggler while the HSM runs); a reset
			# fails reads for tens of ms, or shows as STM0 restarting (BlueBox: the read blocks
			# through the reconnect).
			if {[incr fails] < 2} {
				sleep 1
				continue
			}
			if {$down_since < 0} {
				set down_since $now
				if {$prev ne ""} { incr n }
			}
			set calm $now
			set prev ""
		} else {
			set fails 0
			if {$down_since >= 0 || ($prev ne "" && $s < $prev)} {
				if {$down_since < 0} { incr n }
				set down_since -1
				set calm $now
				tc3xx_after_reset
				set s [tc3xx_stm64]
			}
			if {$s ne ""} {
				set prev $s
			}
		}
		set down [expr {$down_since < 0 ? 0 : $now - $down_since}]
		if {$now - $calm >= $quiet_ms && ($until eq "" || [uplevel #0 $until])} {
			return [dict create settled 1 resets $n elapsed [expr {$now - $t0}] down $down]
		}
		if {$now - $t0 >= $max_ms} {
			return [dict create settled 0 resets $n elapsed [expr {$now - $t0}] down $down]
		}
		sleep 2
	}
}

# --- Event handlers ----------------------------------------------------------------------------------

# init (hot attach) and every reset the poll detects: restore what a reset cleared. A session that
# starts on halted cores (an earlier session ended halted): halt them all together again, as the halt
# that left them did, or the part of the application still running resets the board.
proc tc3xx_on_examine {} {
	tc3xx_after_reset
	if {[[tc3xx_cpu0] curstate] eq "halted"} {
		tc3xx_tl1_force
	}
	tc3xx_policy_call examine
}

# After a reset the server ran itself (the policy's reset hook calls "reset halt|run|init"). Halted:
# latch TL1 so the boot-halted cores and all STMs stay stopped until continue, start the HSM (the
# bootloader waits for it) and suspend the peripherals that are already on.
proc tc3xx_on_reset_end {} {
	global tc3xx_hsm_autostart tc3xx_reg tc3xx_reset_quick tc3xx_reset_todo
	if {$tc3xx_reset_quick ne "0"} {
		# OCDS, the HSM out of its boot breakpoint and the reset-class suspend (STM0/1 before the
		# application locks them), nothing else. A board whose SBC sees the debugger's reset (FS26
		# INIT_FS) resets the chip if the core is still halted ~256 ms after it, unless the
		# application initialized the FS26 by then; through the BlueBox the probe's reset and
		# aurix-dbg's re-examination use up most of that, and the policy must see the FS26's reset
		# coming. The rest follows in tc3xx_reset_finish.
		# The HSM first: it needs ~32 ms after its release to report ready (HSM2HTS), and the
		# application must not start before that (it ended up looping in the bootloader); the
		# suspend is written meanwhile.
		tc3xx_ocds_enable
		set hsm [expr {$tc3xx_hsm_autostart && [tc3xx_hsm_release]}]
		tc3xx_periph_mark_reset
		tc3xx_periph_suspend_fresh
		if {$hsm && $tc3xx_reset_quick eq "run"} {
			tc3xx_hsm_wait_ready
		}
		set tc3xx_reset_todo 1
		# Not resumed here, even for a reset that runs on: the policy's resume right after does it
		# with the server's state (a second resume from a stale "halted" restored the interrupt
		# enable saved at the reset vector into the running application, which then hung).
		tc3xx_policy_call reset-end
		return
	}
	tc3xx_after_reset
	set cpu0 [tc3xx_cpu0]
	if {[$cpu0 curstate] eq "halted"} {
		tc3xx_tl1_force
		if {$tc3xx_hsm_autostart && [tc3xx_hsm_release]} {
			tc3xx_hsm_wait_ready
		} else {
			# The halted HSM keeps BRKOUT active: unroute it from TL1.
			tc3xx_wr CBS_TRHSM $tc3xx_reg(CBS_TRHSM) 0
		}
		tc3xx_periph_suspend all
	}
	tc3xx_policy_call reset-end
}

# The part of a quick reset-end (tc3xx_reset_quick) that could wait: TL1 routing, the HSM debug
# enable, and with cpu0 halted the TL1 latch and the suspend of the modules already on.
proc tc3xx_reset_finish {} {
	global tc3xx_reset_todo
	if {!$tc3xx_reset_todo} {
		return
	}
	set tc3xx_reset_todo 0
	tc3xx_tl1_config
	tc3xx_hsm_debug_enable
	if {![catch {tc3xx_rd $::tc3xx_dbgsr([tc3xx_cpu0])} d] && ($d & 0x6) == 0x2} {
		tc3xx_tl1_force
		tc3xx_periph_suspend all
	}
}

# STMs while stepping: "run" lets them advance with the cores during a TL1-gated step, "frozen" (SUSP
# set while halted) keeps them stopped. At runtime: monitor tc3xx_step_timers frozen
proc tc3xx_step_timers {{mode ""}} {
	global tc3xx_step_timers
	if {$mode ne ""} {
		if {[lsearch -exact {run frozen} $mode] < 0} {
			return -code error "usage: tc3xx_step_timers ?run|frozen?"
		}
		set tc3xx_step_timers $mode
	}
	return $tc3xx_step_timers
}

proc tc3xx_halt_susp {} {
	expr {$::tc3xx_step_timers eq "frozen" ? 0x10 : 0}
}

proc tc3xx_on_halted {self} {
	global tc3xx_cores
	if {[tc3xx_halt_susp]} {
		foreach t $tc3xx_cores { tc3xx_susout $t 1 }
	}
	# Modules still to do (enabled by the application only now): better late than never. Not in the
	# halt of a quick reset (tc3xx_reset_quick): ~25 accesses, 30-40 ms through a BlueBox, in the
	# short halted phase; reset-end and tc3xx_reset_finish do it there.
	if {$::tc3xx_reset_quick eq "0"} {
		tc3xx_periph_suspend all
	}
	tc3xx_policy_call halted $self
}

# Release the other cores' debug halt (HALT[2:1]=10); the held TL1 keeps them suspended until
# resume-end.
proc tc3xx_on_resume_start {self} {
	global tc3xx_dbgsr tc3xx_hsm
	foreach t [tc3xx_others $self] {
		tc3xx_wr "$t DBGSR" $tc3xx_dbgsr($t) 0x4
	}
	if {$self ne $tc3xx_hsm} {
		tc3xx_hsm_resume
	}
}

# Drop the TL1 hold: all cores and STMs start in the same cycle. The first resume after a reset waits
# for the application to enable the app-class modules and suspends them, so they are set before the
# next halt (the EVADC is enabled ~34 ms after the start).
proc tc3xx_on_resume_end {self} {
	global tc3xx_cores tc3xx_periph_fresh tc3xx_periph_wait_ms
	foreach t $tc3xx_cores { tc3xx_susout $t 0 }
	tc3xx_tl1_release
	tc3xx_reset_finish
	if {$tc3xx_periph_fresh} {
		set tc3xx_periph_fresh 0
		tc3xx_periph_suspend app $tc3xx_periph_wait_ms
	}
	tc3xx_policy_call resumed $self
}

# tl1_step (aurix-dbg): release the others' debug halt while TL1 still holds them; aurix-dbg releases
# $self and drops the hold, so all cores run for the instruction. Otherwise (OpenOCD): debug halt the
# others (HALT[2:1]=11, SUSP=1) and drop the hold, so only $self runs.
proc tc3xx_on_step_start {self} {
	global tc3xx_dbgsr
	if {![catch {$self tricore tl1_step} mode] && $mode eq "tl1_step on"} {
		set susp [tc3xx_halt_susp]
		foreach t [tc3xx_others $self] {
			tc3xx_wr "$t DBGSR" $tc3xx_dbgsr($t) [expr {0x4 | $susp}]
		}
		tc3xx_wr "$self DBGSR.SUSP" $tc3xx_dbgsr($self) $susp
	} else {
		foreach t [tc3xx_others $self] {
			tc3xx_wr "$t DBGSR" $tc3xx_dbgsr($t) 0x16
		}
		tc3xx_susout $self 1
		tc3xx_tl1_release
	}
}

# Optional halted handler for MCS channels: halt all cores when a channel stops at a breakpoint or
# step. A TriCore continue does not enable MCS channels.
#   foreach t $tc3xx_mcs_targets { $t configure -event halted "tc3xx_mcs_halt_all $t" }
proc tc3xx_mcs_halt_all {self} {
	if {[$self debug_reason] in {breakpoint single-step}} {
		tc3xx_tl1_force
	}
}

# --- Diagnostics -------------------------------------------------------------------------------------

# monitor tc3xx_status: TL1, per core DBGSR and its STM, per peripheral OCS (SUS requested, SUSSTA =
# suspended right now).
proc tc3xx_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_reg tc3xx_periph_list tc3xx_periph_todo
	echo [format "CBS: TLS.TL1=%d  TLC=0x%08x  TL1ST=0x%08x  TLCHE=0x%08x  OSTATE=0x%08x" \
		[expr {([tc3xx_rd $tc3xx_reg(CBS_TLS)] >> 1) & 1}] [tc3xx_rd $tc3xx_reg(CBS_TLC)] \
		[tc3xx_rd $tc3xx_reg(CBS_TL1ST)] [tc3xx_rd $tc3xx_reg(CBS_TLCHE)] [tc3xx_rd $tc3xx_reg(OSTATE)]]
	foreach t $tc3xx_cores {
		set dbg [tc3xx_rd $tc3xx_dbgsr($t)]
		echo [format "%s DBGSR=0x%08x (HALT=%d SIH=%d SUSP=%d)" $t $dbg \
			[expr {($dbg >> 1) & 3}] [expr {($dbg >> 3) & 1}] [expr {($dbg >> 4) & 1}]]
	}
	foreach e $tc3xx_periph_list {
		lassign $e name ocs clc accen sus class
		if {[catch {tc3xx_rd $ocs} v]} {
			echo [format "%-9s %-5s OCS unreadable" $name $class]
			continue
		}
		echo [format "%-9s %-5s OCS=0x%08x SUS=%d (want %d) SUSSTA=%d %s" $name $class $v \
			[expr {($v >> 24) & 0xF}] $sus [expr {($v >> 29) & 1}] [expr {$tc3xx_periph_todo($name) ? "TO DO" : ""}]]
	}
}

# monitor tc3xx_wdt_status: watchdogs and the cause of the last reset. OSTATE.WDTSUS=0: all watchdogs
# suspended while OCDS is enabled; 1: a CPU watchdog only while its CPU's SUSOUT is set.
proc tc3xx_wdt_status {} {
	global tc3xx_cores tc3xx_dbgsr tc3xx_coreid tc3xx_reg
	set ostate [tc3xx_rd $tc3xx_reg(OSTATE)]
	echo [format "OSTATE=0x%08x OEN=%d WDTSUS=%d" $ostate [expr {$ostate & 1}] [expr {($ostate >> 7) & 1}]]
	set wdts {}
	foreach t $tc3xx_cores {
		lappend wdts WDTCPU$tc3xx_coreid($t) [tc3xx_wdtcpu_sr $tc3xx_coreid($t)] $t
	}
	lappend wdts WDTS $tc3xx_reg(WDTS_SR) ""
	foreach {name addr t} $wdts {
		set sr1 [tc3xx_rd $addr]
		sleep 100
		set sr2 [tc3xx_rd $addr]
		set susout ""
		if {$t ne ""} {
			set susout [format "  SUSOUT=%d" [expr {([tc3xx_rd $tc3xx_dbgsr($t)] >> 4) & 1}]]
		}
		echo [format "%-7s SR=0x%08x TIM=0x%04x %-8s DS=%d OE=%d AE=%d%s" $name $sr2 [expr {($sr2 >> 16) & 0xFFFF}] \
			[expr {(($sr1 ^ $sr2) >> 16) & 0xFFFF ? "COUNTING" : "stopped"}] \
			[expr {($sr2 >> 3) & 1}] [expr {($sr2 >> 1) & 1}] [expr {$sr2 & 1}] $susout]
	}
	set rst [tc3xx_rd $tc3xx_reg(RSTSTAT)]
	set causes {}
	foreach {bit name} {0 ESR0 1 ESR1 3 SMU 4 SW 5 STM0 6 STM1 7 STM2 16 PORST 18 CB0 19 CB1 20 CB3 23 EVRC 24 EVR33 25 SWD 28 STBYR} {
		if {($rst >> $bit) & 1} { lappend causes $name }
	}
	echo [format "RSTSTAT=0x%08x last reset: %s" $rst [expr {[llength $causes] ? [join $causes ", "] : "-"}]]
}
